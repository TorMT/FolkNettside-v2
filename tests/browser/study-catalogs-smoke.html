<!doctype html>
<html lang="no"><head><meta charset="utf-8"><title>Native study catalogs smoke</title></head>
<body data-status="running"><main id="mount"></main><pre id="result">Running</pre>
<script type="module">
import {studyCatalogPageHTML,mountStudyCatalog} from "../../src/diverse/study-catalog-pages.js";
const assert=(condition,message)=>{if(!condition)throw new Error(message)};
const originalFetch=globalThis.fetch;
globalThis.fetch=async url=>{
 if(String(url).includes("kok-link-audit")){
   return new Response(JSON.stringify({
     schemaVersion:1,checkedOn:"2026-10-26",
     summary:{responded:0,http_410:1,inconclusive:1},
     entries:[
       {name:"Example B",url:"https://example.org/b",observation:"http_410"},
       {name:"Example A",url:"https://example.org/a",observation:"inconclusive"}
     ]
   }),{status:200,headers:{"Content-Type":"application/json"}});
 }
 const isKok=String(url).includes("kok-sites");
 return new Response(JSON.stringify({
   schemaVersion:1,verified:true,source:"deterministic browser fixture",items:isKok?[
     {name:"Example B",url:"https://example.org/b",study:"Marine",specialization:"Hydro",cohort:"25",rating:4},
     {name:"Example A",url:"https://example.org/a",study:"Chem",specialization:"Process",cohort:"24",rating:5}
   ]:[{title:"Oblig 1",url:"https://example.org/oblig.pdf",courseCode:"TMR1234"}]
 }),{status:200,headers:{"Content-Type":"application/json"}});
};
try{
 const root=document.getElementById("mount");
 root.innerHTML=studyCatalogPageHTML("kok");
 const first=await mountStudyCatalog(root,{kind:"kok"});
 assert(root.querySelectorAll(".study-catalog-card").length===2,"Expected two student sites");
 assert(root.querySelectorAll(".study-catalog-link-caveat").length===2,
   "Historic link observations missing from source cards");
 assert(root.querySelector("#catalog-provenance").textContent.includes("1 ga HTTP 410"),
   "Dated link audit summary missing");
 assert(root.querySelectorAll("a[href^='https://example.org/']").length===2,
   "Historic external URLs must not be removed based on health snapshot");
 assert(root.querySelector(".study-catalog-results").textContent.includes("2026-10-26"),
   "Historic link caveat missing its observation date");
 const study=root.querySelector("#catalog-study");study.value="Marine";study.dispatchEvent(new Event("change",{bubbles:true}));
 assert(root.querySelectorAll(".study-catalog-card").length===1,"Study filter failed");
 assert(root.querySelector(".study-catalog-card h3")?.textContent==="Example B","Wrong result");
 first.cleanup();
 root.innerHTML=studyCatalogPageHTML("laos");
 let navigated="";
 const second=await mountStudyCatalog(root,{
   kind:"laos",semesters:[{id:3,courses:[{code:"TMR1234",resources:[{title:"Oblig 2",path:"f.pdf"}]}]}],
   onNavigate:route=>navigated=route
 });
 assert(root.querySelectorAll("#catalog-results .study-catalog-card").length===1,"LAOS import missing");
 assert(root.querySelectorAll("#catalog-course-resources .study-catalog-card").length===1,"Courses files missing");
 root.querySelector("[data-catalog-route]").click();
 assert(navigated==="/viewer/3/TMR1234/0","Viewer integration failed");
 second.cleanup();globalThis.fetch=originalFetch;
 document.body.dataset.status="pass";
 document.getElementById("result").textContent="Native LAOS and student sites filters/viewer: PASS";
}catch(error){
 globalThis.fetch=originalFetch;
 document.body.dataset.status="fail";
 document.getElementById("result").textContent=String(error?.stack||error);
}
</script></body></html>
