<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../assets/style.css">
<link rel="stylesheet" href="../../assets/code-viewer.css">
<title>Python and Jupyter VS Code-like viewer browser regression</title>
</head><body data-status="running">
<div id="host" style="max-width:900px;margin:0 auto"></div><pre id="result">running</pre>
<script type="module">
import {render as renderPython} from "../../src/viewers/adapters/python.js";
import {render as renderNotebook} from "../../src/viewers/adapters/notebook.js";
import {render as renderText} from "../../src/viewers/adapters/text.js";
import {mountViewer} from "../../src/viewers/viewer-shell.js";
const host=document.querySelector("#host"),report=document.querySelector("#result");
const check=(ok,message)=>{if(!ok)throw Error(message)};
const fixture={path:"../../examples/semesters/5/TMR4182/Kok/hydro-demo.py",
  name:"hydro-demo.py",label:"Hydro Python"};
let lastRun="",stopped=0;
const fakeSession=()=>({
 async run(source){lastRun=source;return {stdout:"TEST OUTPUT",stderr:"",files:[]}},
 stop(){stopped++},dispose(){},async mount(){return {mounted:0}}
});
let cleanup=[];
try{
 const sourceViewer=await renderPython(host,fixture,{sessionFactory:fakeSession});
 cleanup.push(sourceViewer.cleanup);
 const preview=host.querySelector(".python-code-preview");
 check(preview&&preview.querySelector(".hljs-string")&&preview.querySelector(".hljs-number")&&preview.querySelector(".hljs-built_in"),"Python docstring, numbers and builtins not colored offline");
 check(preview.querySelectorAll(".python-code-line").length>5,"Python line numbers missing");
 const rows=[...preview.querySelectorAll(".python-code-line")];
 const lineHeight=parseFloat(getComputedStyle(rows[0]).lineHeight);
 const spacing=rows[1].getBoundingClientRect().top-rows[0].getBoundingClientRect().top;
 check(spacing<=lineHeight+2&&spacing>=lineHeight-2,
   "Python code lines have extra gaps: "+spacing+" vs "+lineHeight);
 check(getComputedStyle(preview).backgroundColor==="rgb(30, 30, 30)","VS Code dark preview CSS missing");
 const edit=host.querySelector("[data-py-edit]");
 edit.click();
 const editor=host.querySelector(".python-code-edit");
 check(!host.querySelector(".python-editor-stage").hidden,"Editor not visible");
 check(host.querySelector(".python-code-edit-highlight .hljs-string")&&host.querySelector(".python-code-edit-highlight .hljs-number"),"Editor does not color strings and numeric literals");
 editor.value="if True:";
 editor.setSelectionRange(editor.value.length,editor.value.length);
 editor.dispatchEvent(new Event("input",{bubbles:true}));
 editor.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",bubbles:true,cancelable:true}));
 check(editor.value==="if True:\n    ","Colon Enter should insert four spaces");
 editor.dispatchEvent(new KeyboardEvent("keydown",{key:"Tab",bubbles:true,cancelable:true}));
 check(editor.value==="if True:\n        ","Tab should add four more spaces");
 const wrap=host.querySelector("[data-py-wrap]");
 wrap.click();
 check(host.querySelector(".python-editor-stage").classList.contains("soft-wrap"),"Wrap not mirrored in editable highlight");
 const lines=host.querySelector("[data-py-lines]");
 lines.click();
 check(host.querySelector(".python-editor-stage").classList.contains("no-lines"),"Editor line number toggle missing");
 edit.click();
 check(!preview.hidden&&preview.textContent.includes("if True:"),"Preview has stale edited Python");
 host.querySelector("[data-py-run]").click();
 for(let i=0;i<40&&!host.querySelector(".python-output-text").textContent.includes("TEST OUTPUT");i++)
   await new Promise(ok=>setTimeout(ok,20));
 check(lastRun==="if True:\n        ","Python Run did not receive edited code");
 check(host.querySelector(".python-output-text").textContent.includes("TEST OUTPUT"),"Python Run output broken");
 sourceViewer.cleanup();cleanup=[];
 host.replaceChildren();
 const notebook=await renderNotebook(host,{
   path:"../../examples/semesters/5/TMR4182/Kok/hydro-demo.ipynb",
   name:"hydro-demo.ipynb",label:"Hydro notebook"
 },{sessionFactory:fakeSession});
 cleanup.push(notebook.cleanup);
 check(host.querySelectorAll(".notebook-entry").length>=2,"Notebook entries missing");
 check(host.querySelector(".notebook-markdown h1,.notebook-markdown h2,.notebook-markdown p"),"Notebook markdown missing");
 check(host.querySelector(".notebook-entry .python-code-preview .python-code-line"),"Notebook code lines missing");
 check(host.querySelector(".notebook-entry .hljs-keyword,.notebook-entry .hljs-built_in"),
   "Notebook code cell not syntax highlighted");
 const fold=host.querySelector("[data-nb-collapse]");
 fold.click();
 check(host.querySelector(".notebook-cells").classList.contains("notebook-code-collapsed"),"Notebook source collapse missing");
 fold.click();
 check(!host.querySelector(".notebook-cells").classList.contains("notebook-code-collapsed"),"Notebook source did not expand");
 notebook.cleanup();cleanup=[];
 host.replaceChildren();
 const text=await renderText(host,{
   path:"../../examples/semesters/5/TMR4182/Kok/kok-example.md",name:"kok-example.md"
 });
 check(host.querySelector(".code-shell .code-line"),"Generic code viewer lost syntax layout");
 const genericRows=[...host.querySelectorAll(".code-shell .code-line")];
 check(genericRows.length>=2,"Generic viewer fixture needs more than one row");
 const genericLineHeight=parseFloat(getComputedStyle(genericRows[0]).lineHeight);
 check(Math.abs(genericRows[1].getBoundingClientRect().top-
   genericRows[0].getBoundingClientRect().top-genericLineHeight)<2,
   "Generic source viewer has blank grid rows");
 cleanup.push(text.cleanup);
 text.cleanup?.();cleanup=[];host.replaceChildren();
 await mountViewer(host,{
   kind:"FILE",name:"hydro-demo.py",label:"Hydro Python",
   path:"../../examples/semesters/5/TMR4182/Kok/hydro-demo.py"
 },()=>{});
 const page=host.querySelector(".viewer--source");
 check(Boolean(page),"Source viewer did not gain full-width layout class");
 check(getComputedStyle(page.querySelector(".viewer-panel")).display==="none",
   "Source file details should be collapsed by default");
 const details=page.querySelector("#viewer-source-info");
 check(details?.getAttribute("aria-expanded")==="false",
   "Source details toggle missing or incorrectly expanded");
 details.click();
 check(details.getAttribute("aria-expanded")==="true"&&
   getComputedStyle(page.querySelector(".viewer-panel")).display!=="none",
   "Source file details did not open");
 page.querySelector(".viewer-panel").dispatchEvent(new KeyboardEvent("keydown",{
   key:"Escape",bubbles:true
 }));
 check(details.getAttribute("aria-expanded")==="false"&&
   getComputedStyle(page.querySelector(".viewer-panel")).display==="none",
   "Source details Escape close failed");
 check(document.documentElement.scrollWidth<=innerWidth+2,
   "Source viewer introduced horizontal overflow");
 document.body.dataset.status="pass";
 report.textContent="VS Code-like Python, notebook markdown, edit/indent, line numbers, wrap, Run/Stop and text view PASS";
}catch(error){
 document.body.dataset.status="fail";
 report.textContent=String(error?.stack||error);
}finally{for(const dispose of cleanup)dispose?.()}
</script></body></html>
