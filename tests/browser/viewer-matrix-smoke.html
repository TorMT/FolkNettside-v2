<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Viewer adapter matrix smoke</title></head>
<body data-status="running">
<div id="host"></div>
<pre id="result">running</pre>
<script type="module">
import {loadAdapter} from "../../src/viewers/registry.js";
import {mountViewer} from "../../src/viewers/viewer-shell.js";

const host=document.querySelector("#host");
const result=document.querySelector("#result");
const assert=(condition,message)=>{if(!condition)throw new Error(message)};

const cases=[
  {
    id:"markdown",kind:"FILE",
    path:"../../examples/semesters/5/TMR4182/Kok/kok-example.md",
    name:"kok-example.md",label:"Kok example",
    selector:".code-shell",find:"bokslekter"
  },
  {
    id:"python",kind:"FILE",
    path:"../../examples/semesters/5/TMR4182/Kok/hydro-demo.py",
    name:"hydro-demo.py",label:"Hydro demo",
    selector:".python-workbench",find:"volume"
  },
  {
    id:"csv",kind:"FILE",
    path:"../../examples/semesters/5/TMR4182/Kok/hydro-data.csv",
    name:"hydro-data.csv",label:"Hydro data",
    selector:".data-table",find:"draft"
  },
  {
    id:"html",kind:"FILE",
    path:"../../examples/semesters/5/TMR4182/Kok/formula-demo.html",
    name:"formula-demo.html",label:"Formula demo",
    selector:".html-preview"
  },
  {
    id:"notebook",kind:"FILE",
    path:"../../examples/semesters/5/TMR4182/Kok/hydro-demo.ipynb",
    name:"hydro-demo.ipynb",label:"Hydro notebook",
    selector:".notebook-workbench",find:"36.0"
  },
  {
    id:"latex",kind:"FILE",
    path:"../../examples/semesters/5/TMR4182/Forelesninger/formulas.tex",
    name:"formulas.tex",label:"Formula sheet",
    selector:".latex-view",find:"document"
  },
  {
    id:"docx",kind:"FILE",
    url:"../../examples/semesters/5/TMR4182/Filer%20og%20ressurser/Office/hydro-notes.docx",
    name:"hydro-notes.docx",label:"Hydro notes",
    selector:".office-doc",find:"hydro"
  },
  {
    id:"xlsx",kind:"FILE",
    path:"../../examples/semesters/5/TMR4182/Filer%20og%20ressurser/Office/hydro-data.xlsx",
    name:"hydro-data.xlsx",label:"Hydro workbook",
    selector:".office-workbook"
  },
  {
    id:"pptx",kind:"FILE",
    path:"../../examples/semesters/5/TMR4182/Filer%20og%20ressurser/Office/hydro-slides.pptx",
    name:"hydro-slides.pptx",label:"Hydro slides",
    selector:".office-slides"
  },
  {
    id:"pdf",kind:"FILE",
    path:"../../examples/semesters/5/TMR4182/Forelesninger/lecture-01.pdf",
    name:"lecture-01.pdf",label:"Lecture PDF",
    selector:".pdf-frame"
  },
  {
    id:"video",kind:"VIDEO",
    path:"../../examples/semesters/5/TMR4182/Videoer/demo.mp4",
    name:"demo.mp4",label:"Local video fixture",
    selector:".video-view"
  },
  {
    id:"stl",kind:"STL",
    path:"../../examples/models/wedge.stl",
    name:"wedge.stl",label:"Wedge STL",
    selector:".three-stage"
  },
  {
    id:"3mf",kind:"3MF",
    path:"../../examples/models/assembly-demo.3mf",
    name:"assembly-demo.3mf",label:"3MF assembly",
    selector:".three-stage"
  }
];

try{
  const report=[];
  for(const spec of cases){
    host.innerHTML="";
    const adapter=await loadAdapter(spec);
    const rendered=await adapter.render(host,spec);
    assert(host.querySelector(spec.selector),spec.id+" did not render "+spec.selector);
    assert(typeof rendered?.info==="string"&&rendered.info.length>0,spec.id+" missing info");
    if(spec.find){
      assert(typeof rendered.actions?.find==="function",spec.id+" missing Find action");
      const match=rendered.actions.find(spec.find);
      assert(match&&match.total>0,spec.id+" Find returned no matches for "+spec.find);
    }
    if(spec.id==="html"){
      const frame=host.querySelector(".html-preview");
      assert(frame.getAttribute("sandbox")==="allow-scripts","HTML preview sandbox changed");
      assert(frame.srcdoc.length>0,"HTML preview srcdoc empty");
    }
    if(spec.id==="latex"){
      assert(host.querySelectorAll(".latex-math,.latex-math-fallback").length>=2,
        "LaTeX equations are not rendered or shown as safe source fallback");
      const toggle=host.querySelector(".latex-formula-toggle");
      assert(toggle,"LaTeX source toggle is missing");
      toggle.click();
      assert(!host.querySelector("[data-latex-source]").hidden,"LaTeX source toggle did not show file");
      toggle.click();
      assert(host.querySelector("[data-latex-source]").hidden,"LaTeX rendered view not restored");
    }
    if(spec.id==="notebook")assert(host.querySelectorAll(".nb-cell").length>=2,"Notebook cells missing");
    if(spec.id==="xlsx")assert(host.querySelectorAll(".office-sheet").length>=1,"Workbook sheet missing");
    if(spec.id==="pptx")assert(host.querySelectorAll(".office-slide").length>=1,"Slides missing");
    if(spec.id==="video"){
      assert(typeof rendered.actions?.resetProgress==="function","Video missing resetProgress action");
      rendered.actions.resetProgress();
      assert(host.querySelector(".video-resume")?.textContent==="Progress reset","Video progress reset feedback missing");
    }
    if(spec.id==="stl"||spec.id==="3mf"){
      assert(typeof rendered.actions?.fit==="function",spec.id+" missing Fit action");
      assert(typeof rendered.actions?.resetZoom==="function",spec.id+" missing Reset view action");
      const bounds=rendered.actions.getBounds?.();
      assert(bounds&&bounds.size.every(value=>Number.isFinite(value)&&value>=0),spec.id+" invalid model bounds");
      rendered.actions.fit();
      rendered.actions.resetZoom();
    }
    rendered?.cleanup?.();
    report.push(spec.id);
  }
  // An old asynchronous adapter must never claim the new page after navigation.
  const raceRoot=document.createElement("div");
  document.body.append(raceRoot);
  const beforeFetch=window.fetch;
  let releaseOld=null;
  window.fetch=(input,options)=>{
    const path=String(typeof input==="string"?input:input?.url||input);
    if(path.includes("__viewer_slow.txt"))
      return new Promise(resolve=>{releaseOld=()=>resolve(new Response("OLD STALE CONTENT",{status:200}))});
    if(path.includes("__viewer_fast.txt"))
      return Promise.resolve(new Response("NEW ACTIVE CONTENT",{status:200}));
    return beforeFetch(input,options);
  };
  try{
    const details={kind:"FILE",semester:5,courseCode:"TEST",section:"Demo"};
    const oldRender=mountViewer(raceRoot,{...details,path:"__viewer_slow.txt",name:"slow.txt",label:"Older viewer"},()=>{});
    for(let i=0;i<50&&!releaseOld;i++)await new Promise(resolve=>setTimeout(resolve,20));
    assert(releaseOld,"Slow viewer request did not start");
    const newRender=mountViewer(raceRoot,{...details,path:"__viewer_fast.txt",name:"fast.txt",label:"Current viewer"},()=>{});
    await newRender;
    assert(raceRoot.querySelector(".viewer-head strong")?.textContent==="Current viewer","New viewer failed to mount");
    assert(raceRoot.querySelector("#viewer-canvas")?.textContent.includes("NEW ACTIVE CONTENT"),"New resource contents missing");
    releaseOld();
    await oldRender;
    assert(raceRoot.querySelector(".viewer-head strong")?.textContent==="Current viewer","Old viewer took over after navigation");
    assert(raceRoot.querySelector("#viewer-canvas")?.textContent.includes("NEW ACTIVE CONTENT"),"Stale adapter erased new resource");
    assert(!raceRoot.querySelector("#viewer-canvas")?.textContent.includes("OLD STALE CONTENT"),"Stale content rendered");
  }finally{
    window.fetch=beforeFetch;
    raceRoot.__viewerCleanup?.();
    raceRoot.remove();
  }
  // CORS-blocked public NTNU Python source can be retried with a user-selected
  // local copy without uploading data or changing the original link.
  const ntRoot=document.createElement("div");
  document.body.append(ntRoot);
  const originalFetch=window.fetch;
  const originalRevoke=URL.revokeObjectURL;
  const revoked=[];
  URL.revokeObjectURL=(url)=>{revoked.push(url);return originalRevoke.call(URL,url)};
  window.fetch=(input,options)=>{
    if(/tormt\.folk\.ntnu\.no\/semestre\/5\/Marin-Dynamikk\/filer\/CORS\.(?:py|docx)/.test(String(input)))
      return Promise.reject(new TypeError("Blocked by CORS"));
    return originalFetch(input,options);
  };
  try{
    const ntURL="https://tormt.folk.ntnu.no/semestre/5/Marin-Dynamikk/filer/CORS.py";
    await mountViewer(ntRoot,{name:"CORS.py",label:"CORS example",kind:"PY",
      section:"Filer",semester:5,courseCode:"Marin-Dynamikk",
      source:"ntnu",remoteArchive:true,url:ntURL,path:ntURL},()=>{});
    assert(ntRoot.querySelector("#viewer-choose-local"),"Local CORS retry missing");
    const local=new File(["print('local preview')\n"],"CORS.py",{type:"text/x-python"});
    const input=ntRoot.querySelector("#viewer-local-file");
    const dt=new DataTransfer();dt.items.add(local);input.files=dt.files;
    input.dispatchEvent(new Event("change",{bubbles:true}));
    for(let i=0;i<60&&!ntRoot.querySelector(".python-workbench");i++)
      await new Promise(resolve=>setTimeout(resolve,30));
    assert(ntRoot.querySelector(".python-workbench"),"Downloaded .py not routed to Python viewer");
    assert(ntRoot.querySelector("#viewer-canvas")?.textContent.includes("local preview"),
      "Local Python contents missing");
    assert(ntRoot.querySelector(".viewer-status")?.textContent.includes(ntURL),
      "Original NTNU link was lost after local retry");
    ntRoot.__viewerCleanup?.();
    assert(revoked.some(url=>url.startsWith("blob:")),"Local object URL was not revoked");
    // Native image embeds can fail without rejecting the adapter render.
    const imageRoot=document.createElement("div");document.body.append(imageRoot);
    const imageURL=ntURL.replace("CORS.py","CORS.png");
    try{
      await mountViewer(imageRoot,{name:"CORS.png",label:"Image CORS",kind:"IMAGE",
        section:"Filer",semester:5,courseCode:"Marin-Dynamikk",
        source:"ntnu",remoteArchive:true,url:imageURL,path:imageURL},()=>{});
      assert(imageRoot.querySelector(".image-viewer"),"Image viewer failed to mount");
      assert(imageRoot.querySelector(".viewer-head #viewer-choose-local"),
        "Local open must be visible even without adapter failure");
      const imageInput=imageRoot.querySelector("#viewer-local-file");
      const bytes=Uint8Array.from(atob("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+nOZkAAAAASUVORK5CYII="),c=>c.charCodeAt(0));
      const choice=new DataTransfer();
      choice.items.add(new File([bytes],"CORS.png",{type:"image/png"}));
      imageInput.files=choice.files;imageInput.dispatchEvent(new Event("change",{bubbles:true}));
      for(let i=0;i<60&&!imageRoot.querySelector(".image-viewer img[src^='blob:']");i++)
        await new Promise(resolve=>setTimeout(resolve,20));
      assert(imageRoot.querySelector(".image-viewer img[src^='blob:']"),
        "Image was not opened from the selected local file");
      assert(imageRoot.querySelector(".viewer-status")?.textContent.includes(imageURL),
        "Original image URL was lost");
    }finally{imageRoot.__viewerCleanup?.();imageRoot.remove()}
    // Office previously preferred resource.url over the local blob.
    const fixture="../../examples/semesters/5/TMR4182/Filer%20og%20ressurser/Office/hydro-notes.docx";
    const officeData=await (await originalFetch(fixture)).arrayBuffer();
    const docxURL=ntURL.replace("CORS.py","CORS.docx");
    const docxRoot=document.createElement("div");document.body.append(docxRoot);
    try{
      await mountViewer(docxRoot,{name:"CORS.docx",label:"DOCX local retry",kind:"DOCX",
        section:"Filer",semester:5,courseCode:"Marin-Dynamikk",
        source:"ntnu",remoteArchive:true,url:docxURL,path:docxURL},()=>{});
      assert(docxRoot.querySelector("#viewer-choose-local"),"DOCX local retry control missing");
      const localInput=docxRoot.querySelector("#viewer-local-file");
      const selected=new DataTransfer();
      selected.items.add(new File([officeData],"CORS.docx",{
        type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      }));
      localInput.files=selected.files;localInput.dispatchEvent(new Event("change",{bubbles:true}));
      for(let i=0;i<80&&!docxRoot.querySelector(".office-doc");i++)
        await new Promise(resolve=>setTimeout(resolve,35));
      assert(docxRoot.querySelector(".office-doc"),"DOCX local retry still fetched remote NTNU URL");
      assert(docxRoot.querySelector(".viewer-status")?.textContent.includes(docxURL),
        "Original DOCX URL lost when local copy was opened");
    }finally{
      docxRoot.__viewerCleanup?.();docxRoot.remove();
    }

  }finally{
    window.fetch=originalFetch;URL.revokeObjectURL=originalRevoke;
    ntRoot.__viewerCleanup?.();ntRoot.remove();
  }
  document.body.dataset.status="pass";
  result.textContent="viewer-matrix-smoke: "+report.join(", ")+"; URL-only DOCX and stale-viewer navigation";
}catch(error){
  document.body.dataset.status="fail";
  result.textContent=String(error?.stack||error);
}
</script>
</body>
</html>
