<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mass load sketch browser smoke</title>
<link rel="stylesheet" href="../../assets/style.css">
<link rel="stylesheet" href="../../assets/engineering.css">
<style>#host{width:650px;max-width:95vw}</style></head>
<body data-status="running">
  <textarea id="area"># original area load
0.05, -5, -4, -2, -1, 0</textarea>
  <textarea id="point"># original point mass
1, -4, 0, 1</textarea>
  <div id="host"></div><pre id="result">Checking…</pre>
<script type="module">
import {mountLoadSketch} from "../../src/engineering/load-sketch.js";
import {areaLoadsFromLines,combineHullLoading} from "../../src/hydro/hull-loading.js";
import {pointWeightsFromLines} from "../../src/hydro/point-loads.js";
const check=(pass,message)=>{if(!pass)throw Error(message)};
const area=document.querySelector("#area"),point=document.querySelector("#point"),host=document.querySelector("#host");
const end=mountLoadSketch(host,{bounds:{min:[-5,-2,0],max:[5,2,3]},areaInput:area,pointInput:point});
const svg=host.querySelector("svg");
function draw(from,to,selector=null){
 const rect=svg.getBoundingClientRect();
 const loc=xy=>({clientX:rect.left+xy.x/600*rect.width,
   clientY:rect.top+xy.y/300*rect.height});
 svg.setPointerCapture=()=>{};
 (selector?svg.querySelector(selector):svg).dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,button:0,pointerId:1,...loc(from)}));
 svg.dispatchEvent(new PointerEvent("pointermove",{bubbles:true,button:0,pointerId:1,...loc(to)}));
 svg.dispatchEvent(new PointerEvent("pointerup",{bubbles:true,button:0,pointerId:1,...loc(to)}));
}
try{
 check(svg.getBoundingClientRect().width>0,"Load sketch is hidden or too small");
 host.querySelector("[data-sketch-density]").value=".25";
 host.querySelector("[data-sketch-z]").value="1.5";
 let inputs=0;area.addEventListener("input",()=>inputs++);
 draw({x:150,y:75},{x:450,y:225});
 const areas=areaLoadsFromLines(area.value);
 check(areas.length===2,"Drawing did not append a second area load");
 check(area.value.startsWith("# original area load"),"Existing area input overwritten");
 check(Math.abs(areas[1].x0+2.5)<1e-6&&Math.abs(areas[1].y1-1)<1e-6,"Coordinates mapped incorrectly");
 check(areas[1].z===1.5&&areas[1].densityTonnesPerM2===.25,"Drawn elevation or density lost");
 check(inputs===1,"Area change did not emit an input event");
 check(svg.querySelectorAll("[data-sketch-area]").length===2,"Old+new area load preview missing");
 host.querySelector('[data-sketch-mode="point"]').click();
 host.querySelector("[data-sketch-mass]").value="-2";
 host.querySelector("[data-sketch-z]").value="2.5";
 draw({x:400,y:150},{x:400,y:150});
 const points=pointWeightsFromLines(point.value);
 check(points.length===2,"Point drawing did not append a mass load");
 check(points[1].massTonnes===-2&&points[1].z===2.5,"Signed point mass height lost");
 check(svg.querySelectorAll("[data-sketch-point]").length===2,"Point preview missing");
 const combined=combineHullLoading({hullMassTonnes:20,hullCG:[0,0,1],pointWeights:points,areaLoads:areas});
 check(Number.isFinite(combined.totalMassTonnes)&&
   combined.centerOfGravity.every(Number.isFinite),"Combined load failed physics validation");
 const beforeEdit=area.value;
 host.querySelector('[data-sketch-mode="edit"]').click();
 draw({x:300,y:150},{x:300,y:150},'[data-sketch-area="1"]');
 check(host.querySelector("[data-sketch-selection]").hidden===false,"Load selection did not open");
 check(host.querySelector("[data-sketch-selection-label]").textContent==="Area load 2","Selected wrong load");
 check(host.querySelector("[data-sketch-z]").value==="1.5","Selected load Z not populated");
 host.querySelector("[data-sketch-density]").value=".5";
 host.querySelector("[data-sketch-z]").value="2.75";
 host.querySelector("[data-sketch-save]").click();
 let edited=areaLoadsFromLines(area.value);
 check(edited.length===2&&edited[1].densityTonnesPerM2===.5&&edited[1].z===2.75,
   "Selected mass and Z were not updated");
 check(edited[0].densityTonnesPerM2===.05,"Editing selected load changed original load");
 draw({x:300,y:150},{x:360,y:120},'[data-sketch-area="1"]');
 edited=areaLoadsFromLines(area.value);
 check(edited[1].x0>-2.5&&edited[1].y0>-1,"Area did not move in X/Y");
 check(edited[1].densityTonnesPerM2===.5&&edited[1].z===2.75,
   "Moving rectangle corrupted its mass density or height");
 check(host.querySelectorAll("[data-sketch-area]").length===2,"Area disappeared after movement");
 host.querySelector("[data-sketch-delete]").click();
 check(areaLoadsFromLines(area.value).length===1,"Selected area was not removed");
 check(area.value.startsWith("# original area load"),"Remove deleted comments or first area");
 host.querySelector("[data-sketch-undo]").click();
 check(areaLoadsFromLines(area.value).length===2,"Undo did not restore removed load");
 check(area.value!==beforeEdit,"Editing and dragging did not persist the selected mass");
 // Point mass: select from SVG, move and remove without affecting other rows.
 const pointBefore=point.value;
 const selectedPoint=svg.querySelector('[data-sketch-point="1"]');
 const selectedPointX=Number(selectedPoint.getAttribute("cx"));
 const selectedPointY=Number(selectedPoint.getAttribute("cy"));
 draw({x:selectedPointX,y:selectedPointY},{x:selectedPointX,y:selectedPointY},'[data-sketch-point="1"]');
 check(host.querySelector("[data-sketch-selection-label]").textContent==="Point mass 2","Point selection failed");
 host.querySelector("[data-sketch-mass]").value="-1.25";
 host.querySelector("[data-sketch-z]").value="4";
 host.querySelector("[data-sketch-save]").click();
 check(pointWeightsFromLines(point.value)[1].massTonnes===-1.25,"Point mass edit failed");
 check(pointWeightsFromLines(point.value)[1].z===4,"Point elevation edit failed");
 host.querySelector("[data-sketch-undo]").click();
 check(point.value===pointBefore,"Point mass undo did not restore original rows");
 end();
 // Real 3D triangle projection: test explicit deck metadata, Z snapping,
 // accepted footprints and rejection over unmeshed bounding-box territory.
 const surfaceHost=document.createElement("div");
 surfaceHost.style.width="650px";
 const surfaceArea=document.createElement("textarea");
 const surfacePoint=document.createElement("textarea");
 document.body.append(surfaceArea,surfacePoint,surfaceHost);
 const syntheticDeck={unitScaleToMeters:1,components:[{
   id:"physical-deck",name:"Test deck",type:"deck",
   metadata:{semantic:{role:"deck"}},
   geometry:{positions:[-2,-1,3,2,-1,3,2,1,3,-2,1,3],
     indices:[0,1,2,0,2,3]}
 }]};
 const stopSurface=mountLoadSketch(surfaceHost,{
   modelDocument:syntheticDeck,
   bounds:{min:[-5,-2,0],max:[5,2,4]},
   areaInput:surfaceArea,pointInput:surfacePoint
 });
 const plane=surfaceHost.querySelector("svg");
 const surfaceSelect=surfaceHost.querySelector("[data-sketch-surface]");
 check(surfaceSelect.value!=="manual","Explicit deck should be the selected placement surface");
 check(plane.querySelectorAll("polygon").length===2,"Actual 3D deck faces not projected into sketch");
 check(surfaceHost.querySelector("[data-sketch-z]").value==="3","Deck height not sourced from 3D geometry");
 check(surfaceHost.querySelector("[data-sketch-z]").readOnly,"Deck Z must be geometry constrained");
 const sketch=(from,to,which=plane)=>{
   const rc=plane.getBoundingClientRect();
   const xy=p=>({clientX:rc.left+p.x/600*rc.width,clientY:rc.top+p.y/300*rc.height});
   plane.setPointerCapture=()=>{};
   which.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,button:0,pointerId:21,...xy(from)}));
   plane.dispatchEvent(new PointerEvent("pointermove",{bubbles:true,button:0,pointerId:21,...xy(to)}));
   plane.dispatchEvent(new PointerEvent("pointerup",{bubbles:true,button:0,pointerId:21,...xy(to)}));
 };
 sketch({x:270,y:120},{x:330,y:180});
 check(areaLoadsFromLines(surfaceArea.value).length===1,"Valid deck-covered area not accepted");
 check(areaLoadsFromLines(surfaceArea.value)[0].z===3,"Saved mass elevation differs from actual deck Z");
 const validText=surfaceArea.value;
 sketch({x:80,y:120},{x:290,y:180});
 check(surfaceArea.value===validText,"Partly unsupported rectangle was incorrectly accepted");
 check(surfaceHost.querySelector("[data-sketch-status]").textContent.includes("surface"),
   "Unsupported area should report selected surface coverage error");
 surfaceHost.querySelector('[data-sketch-mode="point"]').click();
 sketch({x:300,y:150},{x:300,y:150});
 check(pointWeightsFromLines(surfacePoint.value)[0].z===3,"Deck point height was not snapped");
 const safePoint=surfacePoint.value;
 sketch({x:70,y:70},{x:70,y:70});
 check(surfacePoint.value===safePoint,"Out-of-deck point incorrectly accepted");
 stopSurface();
 document.body.dataset.status="pass";
 document.querySelector("#result").textContent="PASS: editing, undo, mesh deck projection, footprint rejection and Hydro mass/CG";
}catch(error){
 end();document.body.dataset.status="fail";
 document.querySelector("#result").textContent=String(error?.stack||error);
}
</script></body></html>
