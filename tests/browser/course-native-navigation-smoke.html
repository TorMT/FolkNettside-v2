<!doctype html><html lang="no"><head><meta charset="utf-8"><title>Course native links smoke</title>
<meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body data-status="running"><pre id="result">running</pre>
<script type="module">
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const check=(condition,message)=>{if(!condition)throw Error(message)};
const wait=async(fn,message)=>{for(let i=0;i<170;i++){
  const result=fn();if(result)return result;await sleep(100);
}throw Error(message)};
try{
 const frame=document.createElement("iframe");
 frame.src="../../index.html#/courses/5";
 frame.style.cssText="width:1100px;height:900px;border:0";
 document.body.append(frame);
 const doc=()=>frame.contentDocument;
 const win=()=>frame.contentWindow;
 const link=await wait(()=>doc()?.querySelector('.course-card[data-course="TMR4182"]'),
   "Native course link is not visible");
 check(link.matches("a[href]"),"Course card is not a native anchor");
 check(link.getAttribute("href")==="#/courses/5/TMR4182","Incorrect course href");
 check(!doc().querySelector(".course-source-status"),"Redundant top status bar still shown");
 link.click();
 await wait(()=>doc()?.querySelector(".course-header h1")?.textContent?.includes("Marin"),
   "Click on course did not open the actual course");
 check(win().location.hash==="#/courses/5/TMR4182","Course URL did not update");
 const file=await wait(()=>doc()?.querySelector(".resource-viewer-link[href^='#/viewer/5/TMR4182/']"),
   "Real native file viewer links missing");
 // Local Chrome fixtures intentionally do not have a NTNU source URL.
 // Public NTNU URLs and fallback links are covered by Node manifest tests.
 const original=file.closest(".resource-row")?.querySelector(".resource-original-link");
 if(original)check(original.href.startsWith("https://tormt.folk.ntnu.no/semestre/"),
   "Unsafe original URL");
 file.click();
 await wait(()=>doc()?.querySelector("#viewer-back"),"Clicking file did not open viewer");
 check(win().location.hash.startsWith("#/viewer/5/TMR4182/"),"Viewer URL incorrect");
 const firstHolder=doc().querySelector(".viewer")?.parentElement;
 await wait(()=>doc()?.querySelector("#viewer-info")?.textContent!=="Loading…",
   "Viewer adapter did not settle");
 let nativeCleanups=0;
 const firstCleanup=firstHolder.__viewerCleanup;
 firstHolder.__viewerCleanup=()=>{nativeCleanups++;firstCleanup?.()};
 const breadcrumb=doc().querySelector(".viewer-breadcrumb a[href='#/courses/5']");
 check(breadcrumb,"Viewer semester breadcrumb missing");
 breadcrumb.click();
 await wait(()=>win().location.hash==="#/courses/5"&&doc()?.querySelector(".course-card"),
   "Breadcrumb did not return to semester");
 check(nativeCleanups===1,"Native breadcrumb did not dispose old viewer exactly once");
 check(firstHolder.__viewerCleanup===null,"Old viewer retained cleanup after navigation");
 // Ensure Back navigation still returns to the course as before.
 win().location.hash="#/courses/5/TMR4182";
 await wait(()=>doc()?.querySelector(".resource-viewer-link"),"Course did not reopen");
 doc().querySelector(".resource-viewer-link").click();
 await wait(()=>doc()?.querySelector("#viewer-back"),"Viewer did not reopen after breadcrumb");
 doc().querySelector("#viewer-back").click();
 await wait(()=>doc()?.querySelector(".course-header h1")?.textContent?.includes("Marin"),
   "Back did not return to course");
 document.body.dataset.status="pass";
 document.getElementById("result").textContent="Course, file viewer, original links and back navigation PASS";
}catch(error){
 document.body.dataset.status="fail";
 document.getElementById("result").textContent=String(error?.stack||error);
}
</script></body></html>
