<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses scroll navigation regression</title>
<link rel="stylesheet" href="../../assets/style.css">
<style>
  html{scroll-behavior:auto}
  .test-topbar{position:sticky;top:0;height:58px;z-index:30;background:#173448}
  .layout{min-height:2800px}
  .course-side{position:sticky;top:58px;height:calc(100vh - 58px)}
  .course-header{height:400px;margin:0 0 24px}
  .resource-section{height:760px;margin:24px 0}
  #course-karakterweb{height:640px}
  .test-result{position:fixed;z-index:100;right:0;top:0;padding:4px;background:white}
</style>
<body data-status="running">
<div class="topbar test-topbar"><strong>Courses navigation test</strong></div>
<main class="layout">
 <aside class="side course-side">
  <button data-course-nav="overview" class="active">Overview</button>
  <button data-course-nav="section-0">Forelesninger</button>
  <button data-course-nav="section-1">Kok</button>
  <button data-course-nav="karakterweb">Karakterweb</button>
 </aside>
 <section class="content">
  <header class="course-header" id="course-overview"><h1>Overview</h1></header>
  <section class="resource-section" id="course-section-0"><h2>Forelesninger</h2></section>
  <section class="resource-section" id="course-section-1"><h2>Kok</h2></section>
  <section class="resource-section" id="course-karakterweb"><h2>Karakterweb</h2></section>
 </section>
</main>
<pre class="test-result" id="result">running</pre>
<script type="module">
import {bindCourseNavigation} from "../../src/courses/course-navigation.js";
const entries=[["overview","#course-overview"],["section-0","#course-section-0"],["section-1","#course-section-1"],["karakterweb","#course-karakterweb"]].map(([id,sel])=>({id,element:document.querySelector(sel)}));
const nav=bindCourseNavigation({sections:entries,buttons:document.querySelectorAll("[data-course-nav]"),topbar:document.querySelector(".topbar")});
const wait=ms=>new Promise(ok=>setTimeout(ok,ms));
const selected=()=>[...document.querySelectorAll("[data-course-nav].active")].map(x=>x.dataset.courseNav);
function check(id,label){
 const list=selected();
 if(list.length!==1||list[0]!==id||nav.getActiveId()!==id)throw Error(label+": expected "+id+" got "+JSON.stringify(list)+" "+nav.getActiveId());
}
try{
 await wait(180);
 document.querySelector('[data-course-nav="section-1"]').click();
 check("section-1","click should immediately activate Kok");
 await wait(1400);
 check("section-1","Kok must remain highlighted after smooth scroll");
 const top=document.querySelector("#course-section-1").getBoundingClientRect().top;
 if(Math.abs(top-82)>12)throw Error("Kok scroll offset incorrect: "+top);
 // Small scrolls around the anchor must not light up Forelesninger.
 window.scrollTo({top:window.scrollY+9,behavior:"instant"});
 await wait(160);
 check("section-1","small scroll drift");
 document.querySelector('[data-course-nav="section-0"]').click();
 check("section-0","click should immediately activate Forelesninger");
 await wait(1400);
 check("section-0","Forelesninger after smooth scroll");
 const first=document.querySelector("#course-section-0").getBoundingClientRect().top;
 if(Math.abs(first-82)>12)throw Error("Forelesninger scroll offset incorrect: "+first);
 window.scrollTo({top:window.scrollY+35,behavior:"instant"});
 await wait(160);
 check("section-0","manual scrolling within Forelesninger");
 nav.disconnect();
 document.body.dataset.status="pass";
 document.querySelector("#result").textContent="pass";
}catch(error){
 nav.disconnect();
 document.body.dataset.status="fail";
 document.querySelector("#result").textContent=error.stack||String(error);
}
</script></body></html>
