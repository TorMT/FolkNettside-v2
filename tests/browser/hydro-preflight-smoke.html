<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hydro preflight browser smoke</title></head>
<body data-status="running"><pre id="result">Running</pre>
<script type="module">
import {boxMesh,reverseWinding} from "../../src/hydro/fixtures.js";
import {validateHydroAsync,analyzeHydroAsync,disposeHydroWorker,gzCurveAsync,hydroCurveAsync,solveHydroDraftAsync} from "../../src/hydro/hydro-client.js";
import {hydroPreflightHTML,hydroPanelHTML} from "../../src/engineering/hydro-panel.js";
import {auditHydroCurve,draftSolutionResidual} from "../../src/hydro/numerical-audit.js";
document.body.dataset.phase="imports-ready";
const assert=(condition,msg)=>{if(!condition)throw new Error(msg)};
const model=(geometry,id)=>({unitScaleToMeters:1,components:[{id,name:"Hull",geometry,metadata:{hydro:true}}]});
try{
 const good=model(boxMesh({L:10,B:3,H:2}),"good");
 document.body.dataset.phase="waiting-for-worker-validation";
 const accepted=await validateHydroAsync(good);
 document.body.dataset.phase="worker-validated";
 assert(accepted.passed,"Fixture hull should pass topology preflight");
 assert(accepted.requiresIndependentReview,"Pass must not certify vessel source");
 assert(hydroPreflightHTML(accepted).includes("not validation of real hull"),"Preflight caution missing");
 document.body.dataset.phase="worker-validated-good";
 const result=await analyzeHydroAsync(good,1);
 assert(Math.abs(result.volume-30)<1e-8,"Worker displacement is incorrect");
 document.body.dataset.phase="auditing-draft-curve";
 const curve=await hydroCurveAsync(good,{minWaterline:.25,maxWaterline:1.75,samples:7});
 const audit=auditHydroCurve(curve);
 assert(audit.status==="pass","Worker hydro V(T)/dVdT audit failed: "+JSON.stringify(audit));
 const solved=await solveHydroDraftAsync(good,21,{
   minWaterline:0,maxWaterline:2,tolerance:1e-8,maxIterations:80
 });
 assert(draftSolutionResidual(solved,21,1e-8).passed,
   "Worker declared a non-converged draft");
 const screen=hydroPanelHTML({
   modelDocument:{...good,name:"Reference barge"},result,curve,
   solved,draft:1,kg:.5,hydroValidation:accepted,
   config:{density:1025,minDraft:0,maxDraft:2}
 });
 assert(screen.results.includes("Numerical consistency"),
   "Hydro UI does not display curve numerical self-check");
 assert(screen.inspector.includes("volume residual"),
   "Hydro UI does not expose solve volume residual");
 const invalid=model(reverseWinding(boxMesh({L:10,B:3,H:2})),"bad");
 const rejected=await validateHydroAsync(invalid);
 assert(!rejected.passed,"Inverted hull incorrectly passed");
 assert(hydroPreflightHTML(rejected).includes("Hydro blocked"),"UI block diagnostics missing");
 let blocked=false;
 try{await analyzeHydroAsync(invalid,1)}catch(error){blocked=/Hydro preflight blocked/.test(String(error))}
 assert(blocked,"Hydro worker did not block inverted hull analysis");
 blocked=false;
 try{await gzCurveAsync(invalid,{targetVolume:30,kg:.5,density:1025,minHeel:-5,maxHeel:5})}
 catch(error){blocked=/Hydro preflight blocked/.test(String(error))}
 assert(blocked,"Hydro worker did not block invalid GZ");
 const overlapA=boxMesh({L:4,B:4,H:2});
 const overlapB=boxMesh({L:4,B:4,H:2,origin:[1,0,0]});
 const crossed={
   positions:[...overlapA.positions,...overlapB.positions],
   indices:[...overlapA.indices,...overlapB.indices.map(i=>i+overlapA.positions.length/3)]
 };
 const intersectionModel=model(crossed,"intersection");
 const intersectionGate=await validateHydroAsync(intersectionModel);
 assert(!intersectionGate.passed,"Closed but intersecting shells passed Web Worker");
 assert(intersectionGate.errors.some(item=>item.includes("intersecting non-adjacent")),
   "Web Worker did not report penetrating faces");
 blocked=false;
 try{await analyzeHydroAsync(intersectionModel,1)}
 catch(error){blocked=/Hydro preflight blocked/.test(String(error))}
 assert(blocked,"Web Worker allowed displacement from penetrating watertight shells");

 disposeHydroWorker();
 document.body.dataset.status="pass";
 document.querySelector("#result").textContent="Hydro worker hull preflight: PASS";
}catch(error){
 disposeHydroWorker();
 document.body.dataset.status="fail";
 document.querySelector("#result").textContent=String(error?.stack||error);
}
</script></body></html>
