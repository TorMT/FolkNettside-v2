<!doctype html>
<html lang="no"><head><meta charset="utf-8"><title>NTNU admin editor browser smoke</title></head>
<body data-status="running">
<iframe id="editor" title="Navneoppsett" src="../../src/courses/name-editor.html" style="width:1200px;height:750px"></iframe>
<pre id="result">running</pre>
<script type="module">
const frame=document.querySelector("#editor");
const output=document.querySelector("#result");
const assert=(ok,message)=>{if(!ok)throw Error(message)};
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
try{
 let doc;
 for(let i=0;i<100;i++){
   doc=frame.contentDocument;
   if(doc?.location?.pathname.endsWith("/src/courses/name-editor.html")&&
      doc.querySelector("#admin-login-form"))break;
   await delay(100);
 }
 assert(doc?.querySelector("#admin-login-form"),"Editor login form did not load");
 assert(doc.querySelector("#admin-gate"),"Admin gate is absent");
 assert(doc.querySelector("#admin-login-form input[type=password]"),"Password field missing");
 assert(doc.querySelector("#publish"),"Publish action missing");
 assert(doc.querySelector("#download"),"Offline backup action missing");
 assert(doc.querySelector("#editor")?.hidden,"Editor must start locked without a verified admin session");
 assert(doc.querySelector("#admin-gate")&&!doc.querySelector("#admin-gate").hidden,
   "Admin login gate should be visible before authorization");
 assert(!doc.querySelector("input[name='file-path']"),
   "Original NTNU source paths must never be editable");
 document.body.dataset.status="pass";
 output.textContent="NTNU editor: anonymous viewers cannot edit; login required";
}catch(error){
 document.body.dataset.status="fail";
 output.textContent=String(error?.stack||error);
}
</script>
</body></html>
