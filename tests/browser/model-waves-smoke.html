<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>3D Hydro waterline and wave viewer functional smoke</title>
<link rel="stylesheet" href="../../assets/style.css"></head>
<body data-status="running" data-phase="loading">
<div id="host" style="width:min(1100px,95vw);height:680px"></div>
<pre id="result">Loading shared WebGL viewer</pre>
<script type="module">
import {boxMesh} from "../../src/hydro/fixtures.js";
import {renderModelWorkbench} from "../../src/viewers/model-workbench.js";
import {readWaveCollection} from "../../src/model/wave-collection.js";
const root=document.querySelector("#host"),result=document.querySelector("#result");
const near=(a,b,eps=.00001)=>{if(!Number.isFinite(a)||Math.abs(a-b)>eps)throw Error('Expected '+a+' ≈ '+b)};
const assert=(v,msg)=>{if(!v)throw Error(msg)};
let workbench=null;
try{
 localStorage.removeItem("folknet-v2:wave-observations:v1");
 const model={format:"3MF",unit:"meter",unitScaleToMeters:1,name:"10m block",components:[{
   id:"hull",name:"Hull",geometry:boxMesh({L:10,B:4,H:3}),metadata:{hydro:true}
 }]};
 workbench=await renderModelWorkbench(root,model);
 const stage=root.querySelector(".three-stage");
 assert(stage&&stage.querySelector("canvas"),"3D viewer missing scene");
 const contour=workbench.actions.getWaterlineInfo();
 assert(contour.status==="ok","Hull contour not computed: "+JSON.stringify(contour));
 assert(contour.loops.length===1,"Expected one actual 3D waterline contour");
 const xs=contour.loops[0].map(p=>p[0]),ys=contour.loops[0].map(p=>p[1]);
 near(Math.max(...xs)-Math.min(...xs),10);
 near(Math.max(...ys)-Math.min(...ys),4);
 const water=root.querySelector("[data-model-water-z]");
 water.value="1.5";water.dispatchEvent(new Event("change"));
 assert(workbench.actions.getWaterlineInfo().loops.length===1,"Waterline Z input not connected");
 workbench.actions.setRotation({x:5});
 assert(workbench.actions.getWaterlineInfo().status==="ok","Contours did not follow roll pose");
 workbench.actions.resetAttitude();
 root.querySelector("[data-model-clip]").click();
 assert(root.querySelector("[data-model-clip]").checked,"Section clipping toggle disabled");
 root.querySelector("[data-model-measure]").click();
 assert(root.querySelector("[data-model-measure]").textContent.includes("On"),"Measurement mode missing");
 const wave=workbench.actions.setWave({enabled:true,heightM:1.2,periodS:5,
   headingDeg:0,animate:false});
 near(wave.amplitudeM,.6);
 near(wave.wavelengthM,9.80665*25/(2*Math.PI));
 const anchored=workbench.actions.setWave({enabled:true,heightM:1.2,periodS:5,
   headingDeg:0,animate:false,motionMode:"anchored",timeS:0});
 near(workbench.actions.getWaveMotionOffset(),0);
 const followCrest=workbench.actions.setWave({enabled:true,heightM:1.2,periodS:5,
   headingDeg:0,animate:false,motionMode:"follow",timeS:0});
 near(workbench.actions.getWaveMotionOffset(),.6);
 const followTrough=workbench.actions.setWave({enabled:true,heightM:1.2,periodS:5,
   headingDeg:0,animate:false,motionMode:"follow",timeS:2.5});
 near(workbench.actions.getWaveMotionOffset(),-.6);
 const pitchPreview=workbench.actions.setWave({enabled:true,heightM:1.2,periodS:5,
   headingDeg:0,phaseDeg:90,animate:false,motionMode:"follow-slope",timeS:0});
 assert(pitchPreview.motionMode==="follow-slope","Wave slope mode not returned");
 const p=workbench.actions.getWaveMotionPose();
 near(p.heaveM,0,1e-9);
 assert(p.pitchRad>0&&Math.abs(p.rollRad)<1e-9,"Head seas must show pitch only");
 assert(Number(stage.querySelector("canvas").dataset.wavePitchDeg)>0,
   "3D scene pitch transform not applied");
 workbench.actions.setWave({enabled:true,heightM:1.2,periodS:5,
   headingDeg:90,phaseDeg:90,animate:false,motionMode:"follow-slope",timeS:0});
 const b=workbench.actions.getWaveMotionPose();
 assert(b.rollRad<0&&Math.abs(b.pitchRad)<1e-9,"Beam seas must show roll only");
 workbench.actions.setWave({enabled:true,heightM:1.2,periodS:5,
   headingDeg:90,phaseDeg:90,animate:false,motionMode:"anchored",timeS:0});
 const still=workbench.actions.getWaveMotionPose();
 near(still.heaveM,0);near(still.rollRad,0);near(still.pitchRad,0);
 workbench.actions.setWave({enabled:false});
 near(workbench.actions.getWaveMotionOffset(),0);

 workbench.actions.setWave({enabled:false});
 const details=root.querySelector(".model-wave-controls");
 assert(details,"Wave interface missing");details.open=true;
 assert(details.querySelector("[data-wave-motion]"),"Anchored/follow UI selector missing");
 assert(details.querySelector('[data-wave-motion] option[value="follow-slope"]'),
   "Wave surface tilt preview option missing");
 assert(details.querySelectorAll("[data-wave-heading-preset]").length===4,
   "Side and head-sea controls missing");
 details.querySelector("[data-wave-motion]").value="follow-slope";
 details.querySelector("[data-wave-motion]").dispatchEvent(new Event("change",{bubbles:true}));
 assert(details.querySelector("[data-wave-show]").textContent==="Hide waves",
   "Selecting surface tilt must show the 3D wave");
 details.querySelector('[data-wave-heading-preset="90"]').click();
 assert(Number(details.querySelector("[data-wave-heading]").value)===90,
   "Port beam button did not change wave heading");
 details.querySelector('[data-wave-heading-preset="270"]').click();
 assert(Number(details.querySelector("[data-wave-heading]").value)===270,
   "Starboard beam button did not change wave heading");
 details.querySelector('[data-wave-heading-preset="180"]').click();
 assert(Number(details.querySelector("[data-wave-heading]").value)===180,
   "Head seas button did not change wave heading");
 details.querySelector('[data-wave-heading-preset="0"]').click();
 assert(Number(details.querySelector("[data-wave-heading]").value)===0,
   "Following seas button did not change wave heading");
 details.querySelector("[data-wave-show]").click();
 const phase=details.querySelector("[data-wave-phase]");
 assert(phase,"Paused wave phase scrubber missing");
 details.querySelector("[data-wave-motion]").value="follow-slope";
 details.querySelector("[data-wave-show]").click();
 phase.value="90";phase.dispatchEvent(new Event("input",{bubbles:true}));
 const scrubbed=workbench.actions.getWaveMotionPose();
 assert(Math.abs(scrubbed.pitchRad)>1e-6,"Scrubbing should reveal pitch at 90°");
 assert(details.querySelector("[data-wave-play]").textContent==="Play",
   "Phase scrub should pause wave animation");
 details.querySelector("[data-wave-show]").click();
 details.querySelector("[data-wave-capture]").click();
 assert(readWaveCollection().length===1,"Synthetic wave collection not persisted");
 const input=details.querySelector("[data-wave-import]");
 const sample=new File(["time_s,eta_m\n0,0.1\n1,0.2\n2,-0.1\n"],"probe.csv",{type:"text/csv"});
 const data=new DataTransfer();data.items.add(sample);input.files=data.files;
 input.dispatchEvent(new Event("change",{bubbles:true}));
 let collection=[];
 for(let check=0;check<70;check++){
   collection=readWaveCollection();
   if(collection.length===2)break;
   await new Promise(resolve=>setTimeout(resolve,100));
 }
 assert(collection.length===2,"Imported wave samples did not persist: "+
   details.querySelector(".model-wave-status")?.textContent+
   " · stored "+collection.length+" series");
 assert(collection.some(x=>x.source==="imported"&&x.wave===null),"CSV provenance was lost");
 assert(details.querySelectorAll(".model-wave-entry").length===2,"Wave library viewer not updated");
 const replay=[...details.querySelectorAll(".model-wave-entry button")].find(btn=>
   btn.textContent.includes("Show this wave in 3D"));
 assert(replay,"Synthetic wave cannot be replayed in the 3D scene");
 replay.click();
 assert(details.querySelector("[data-wave-show]").textContent==="Hide waves",
   "Saved wave did not load into the 3D scene");
 const waveJSON=JSON.stringify({schemaVersion:1,kind:"wave-collection",records:collection});
 for(let i=0;i<2;i++){
   const remove=[...details.querySelectorAll(".model-wave-entry button")].find(btn=>
     btn.textContent==="Remove");
   remove.click();
 }
 assert(readWaveCollection().length===0,"Wave library removal did not persist");
 const library=details.querySelector("[data-wave-json]");
 const archive=new File([waveJSON],"archive.json",{type:"application/json"});
 const libTransfer=new DataTransfer();libTransfer.items.add(archive);library.files=libTransfer.files;
 library.dispatchEvent(new Event("change",{bubbles:true}));
 for(let i=0;i<70&&readWaveCollection().length!==2;i++)
   await new Promise(resolve=>setTimeout(resolve,100));
 assert(readWaveCollection().length===2,"Wave JSON restoration failed: "+
   details.querySelector(".model-wave-status")?.textContent);
 details.querySelector("[data-wave-show]").click();
 assert(details.querySelector("[data-wave-show]").textContent==="Show waves in 3D",
   "3D wave hide toggle did not disable saved-wave replay");
 details.querySelector("[data-wave-show]").click();
 assert(details.querySelector("[data-wave-show]").textContent==="Hide waves",
   "3D wave toggle did not reenable the sea surface");
 details.querySelector("[data-wave-show]").click();
 // RAO CSV must be imported, never synthesized from CAD or inferred from
 // illustrative surface tilt. Drive the actual Three.js rigid-body hierarchy.
 const raoMode=details.querySelector('[data-wave-motion] option[value="rao"]');
 assert(raoMode?.disabled,"RAO mode should be disabled before import");
 const raw=await (await fetch("../../examples/rao/synthetic_six_dof_rao.csv")).text();
 const raoFile=new File([raw],"synthetic_six_dof_rao.csv",{type:"text/csv"});
 const raoInput=details.querySelector("[data-wave-rao-import]");
 const raoTransfer=new DataTransfer();raoTransfer.items.add(raoFile);
 raoInput.files=raoTransfer.files;raoInput.dispatchEvent(new Event("change",{bubbles:true}));
 for(let i=0;i<50&&raoMode.disabled;i++)
   await new Promise(resolve=>setTimeout(resolve,50));
 assert(!raoMode.disabled,"Complete RAO CSV was not imported: "+
   details.querySelector("[data-wave-rao-status]")?.textContent);
 assert(details.querySelector("[data-wave-motion]").value==="rao",
   "RAO import did not activate the 6-DOF mode");
 const field=details.querySelector("[data-wave-height]");
 field.value="2";field.dispatchEvent(new Event("change",{bubbles:true}));
 const scrub=details.querySelector("[data-wave-phase]");
 scrub.value="0";scrub.dispatchEvent(new Event("input",{bubbles:true}));
 const raoPose=workbench.actions.getWaveMotionPose();
 assert(raoPose.mode==="rao","Scene should be in actual imported RAO mode");
 near(raoPose.heaveM,.85*Math.cos(15*Math.PI/180),1e-5);
 near(raoPose.surgeM,.1*Math.cos(20*Math.PI/180),1e-5);
 assert(Number.isFinite(raoPose.pitchRad),"RAO pitch not applied");
 near(Number(stage.querySelector("canvas").dataset.waveSurgeM),raoPose.surgeM,1e-9);
 details.querySelector('[data-wave-heading-preset="90"]').click();
 scrub.value="0";scrub.dispatchEvent(new Event("input",{bubbles:true}));
 const beamPose=workbench.actions.getWaveMotionPose();
 assert(Math.abs(beamPose.yawRad)>.001,"Beam-sea RAO yaw not displayed");
 const heading=details.querySelector("[data-wave-heading]");
 heading.value="45";heading.dispatchEvent(new Event("change",{bubbles:true}));
 assert(details.querySelector(".model-wave-status").textContent.includes("No RAO data"),
   "Missing RAO heading should fail closed");
 heading.value="90";details.querySelector('[data-wave-heading-preset="90"]').click();
 const period=details.querySelector("[data-wave-period]");
 period.value="20";period.dispatchEvent(new Event("change",{bubbles:true}));
 assert(details.querySelector(".model-wave-status").textContent.includes("outside RAO data"),
   "RAO frequency extrapolation must be blocked");
 details.querySelector("[data-wave-rao-remove]").click();
 assert(raoMode.disabled,"Removing RAO must disable RAO mode");
 assert(details.querySelector("[data-wave-motion]").value==="anchored",
   "Removing RAO must switch to anchored mode");
 localStorage.removeItem("folknet-v2:wave-observations:v1");
 workbench.cleanup();workbench=null;
 document.body.dataset.status="pass";
 result.textContent="WebGL 3D contour, roll, water elevation, clip, measure, wave surface, wave probes and observed CSV import PASS";
}catch(error){
 document.body.dataset.status="fail";
 result.textContent=String(error.stack||error);
 workbench?.cleanup();
}
</script></body></html>
