<!doctype html>
<html lang="no"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Munin Hydro acceptance</title>
<style>html,body{margin:0;width:100%;height:100%}iframe{border:0;width:100%;height:100%;display:block}#result{position:fixed;left:-10000px}</style>
</head><body data-status="running">
<iframe id="site" title="Munin i hydroviseren" src="../../index.html#/engineering/hydro"></iframe><pre id="result">running</pre>
<script type="module">
import {loadModelDocument} from '../../src/model/load-model.js';
import {MUNIN_MODEL} from '../../src/engineering/munin-model.js';
import {executeHydroRequest} from '../../src/hydro/hydro-service.js';
import {createHydroInclude} from '../../src/hydro/hydro-selection.js';
const frame=document.querySelector('#site'),doc=()=>frame.contentDocument;
const assert=(ok,message)=>{if(!ok)throw Error(message)};
async function wait(fn,label){for(let i=0;i<300;i++){if(fn())return;await new Promise(r=>setTimeout(r,100))}throw Error('Timeout: '+label)}
try{
 await wait(()=>doc()?.querySelector('#engineering-model-select option[value="munin"]'),'Munin selector');
 doc().querySelector('.analytics-consent-actions button')?.click();
 let select=doc().querySelector('#engineering-model-select');
 select.value='munin';select.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
 await wait(()=>doc()?.querySelector('#hydro-draft')&&doc()?.querySelector('[data-hydro-model-note]'),'validated Munin hydro result');
 await wait(()=>doc()?.querySelector('canvas'),'WebGL model');
 assert(doc().querySelector('#engineering-model-select').value==='munin','selection retained');
 assert(doc().querySelector('.hydro-table tbody tr'),'hydrostatic table calculated');
 assert(doc().querySelector('#hydro-kg').value==='','no invented CG');
 assert(doc().querySelector('#hydro-gz').disabled,'GZ requires user supplied CG');
 assert(doc().querySelector('.results-summary').textContent.includes('0.0347 t'),'small displacement remains readable');
 const draft=doc().querySelector('#hydro-draft');draft.value='-0.12';
 draft.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
 await wait(()=>doc()?.querySelector('.results-summary')?.textContent.includes('0.0631 t'),'waterline changes displacement');
 doc().querySelector('#hydro-target').value='0.035';doc().querySelector('#hydro-solve').click();
 await wait(()=>doc()?.querySelector('.hydro-solve-result'),'35 kg displacement solve');
 assert(!doc().querySelector('.hydro-solve-error'),'target solve must converge');
 await wait(()=>doc()?.querySelector('#engineering-water-status')?.textContent.includes('Displacement solution'),'solved waterline displayed');
 const visual=doc().querySelector('#engineering-water-z');
 assert(visual.readOnly,'Hydro preview must not allow a conflicting independent waterline');
 assert(Math.abs(Number(visual.value)+.12)>.01,'preview still uses the reference instead of solved elevation');
 const solvedText=doc().querySelector('.hydro-solve-result').textContent;
 assert(solvedText.includes(Number(visual.value).toFixed(4)),'preview elevation differs from solved value');
 const precise=doc().querySelector('#hydro-draft');precise.value='-0.12345';
 precise.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
 await wait(()=>doc()?.querySelector('#hydro-draft')?.value==='-0.12345'&&doc()?.querySelector('canvas'),'precise draft preserved');

 for(const control of doc().querySelectorAll('.engineering-model-control select,.engineering-model-control>.btn')){
  const r=control.getBoundingClientRect();assert(r.left>=0&&r.right<=frame.clientWidth+1,'model control clipped');
 }
 assert(doc().querySelector('.viewport').getBoundingClientRect().height>=240,'model viewport collapsed');
 assert(doc().documentElement.scrollWidth<=frame.clientWidth+1,'horizontal overflow');
 const model=await loadModelDocument({...MUNIN_MODEL,sourcePath:'../../assets/models/munin-mobile-preview.glb'});
 assert(model.components.filter(c=>c.geometry).length===130,'actual assembly must retain 130 parts');
 assert(model.components.filter(createHydroInclude(model)).length===2,'only two hulls selected');
 const hydro=executeHydroRequest(model,'analyze',{waterline:-.22});
 assert(hydro.volume>.033&&hydro.volume<.035,'real Munin displacement');
 assert(hydro.components.length===2,'only hulls integrated');
 assert(model.components.some(c=>c.metadata.viewerGroup==='Thrustere / T200 CCW'),'thruster grouping retained');
 select=doc().querySelector('#engineering-model-select');select.value='fixture';
 select.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
 await wait(()=>doc()?.querySelector('#hydro-draft')&&!doc()?.querySelector('[data-hydro-model-note]'),'fixture hydro still works after switching');
 select=doc().querySelector('#engineering-model-select');select.value='munin';
 select.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
 await wait(()=>doc()?.querySelector('#hydro-draft')&&doc()?.querySelector('[data-hydro-model-note]'),'return to Munin');
 await wait(()=>doc()?.querySelector('canvas'),'return to WebGL model');
 document.body.dataset.status='pass';document.querySelector('#result').textContent='Munin Hydro: full assembly, two hulls only, validated hydro table, no invented CG, model switching, viewport '+frame.clientWidth;
}catch(error){document.body.dataset.status='fail';document.querySelector('#result').textContent=error.stack||String(error)}
</script></body></html>
