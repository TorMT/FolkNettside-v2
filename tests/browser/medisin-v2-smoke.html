<!doctype html>
<html lang="no"><head><meta charset="utf-8"><title>MedisinTimer v2 smoke</title></head>
<body data-status="running"><div id="mount"></div><pre id="result">Running</pre>
<script type="module">
import {medisinPageHTML,mountMedisin} from "../../src/diverse/medisin-page.js";
import {connectGoogleSession,disconnectGoogleSession} from "../../src/platform/google-session.js";
import {medisinCloudConsentKey} from "../../src/platform/medisin-cloud-consent.js";
import {decryptMedisinVault,encryptMedisinVault} from "../../src/platform/medisin-vault.js";
import {newMedisinBackup} from "../../src/platform/medisin-drive.js";
import {readEncryptedMedisinDriveBackup,writeEncryptedMedisinDriveBackup} from "../../src/platform/medisin-encrypted-drive.js";
const assert=(condition,message)=>{if(!condition)throw new Error(message)};
try{
  localStorage.removeItem("folk-medisin-v2:guest");
  const root=document.getElementById("mount");
  root.innerHTML=medisinPageHTML();
  const mounted=mountMedisin(root);
  const form=root.querySelector("#medisin-add-form");
  form.elements.name.value="Browser smoke";
  form.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  assert(root.querySelectorAll("[data-medisin-timer]").length===1,"Timer not rendered");
  const dose=root.querySelector("[data-medisin-dose]");
  assert(dose,"Dose button missing");
  dose.click();
  assert(root.querySelector("summary")?.textContent.includes("(1)"),"Dose history missing");
  assert(localStorage.getItem("folk-medisin-v2:guest")?.includes("Browser smoke"),"Local backup missing");
  mounted.cleanup();
  localStorage.removeItem("folk-medisin-v2:guest");

  // Fail closed: corrupt private local history must NOT be replaced with an
  // empty backup when an ordinary form submit/import happens.
  const corruptKey="folk-medisin-v2:guest";
  const damaged='{not-valid-json:"keep these original bytes"';
  localStorage.setItem(corruptKey,damaged);
  root.innerHTML=medisinPageHTML();
  const protectedMount=mountMedisin(root);
  const recovery=root.querySelector("#medisin-corrupt-recovery");
  assert(recovery&&!recovery.hidden,"Damaged data did not reveal recovery instructions");
  assert(root.querySelector("#medisin-count").textContent.includes("sperret"),
    "Corrupt profile was presented as a valid empty history");
  assert(root.querySelector("#medisin-add-form button[type=submit]").disabled,
    "Saving on damaged data must be disabled");
  assert(root.querySelector("#medisin-import").disabled&&root.querySelector("#medisin-sync").disabled,
    "Import/Drive could overwrite damaged history");
  assert(root.querySelector("#medisin-recovery-reset").disabled,
    "Reset must remain blocked until source bytes are exported");
  const lockedForm=root.querySelector("#medisin-add-form");
  lockedForm.elements.name.value="Must not overwrite";
  lockedForm.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  assert(localStorage.getItem(corruptKey)===damaged,
    "Programmatic submit silently replaced corrupt source");
  assert(root.querySelector("#medisin-feedback").textContent.includes("sperret")||
    root.querySelector("#medisin-feedback").textContent.includes("kan ikke leses"),
    "Failure did not tell the user why saving was blocked");
  const oldConfirm=window.confirm;
  let decision=false,confirmCalls=0;
  window.confirm=()=>{confirmCalls++;return decision;};
  try{
    root.querySelector("#medisin-recovery-export").click();
    assert(!root.querySelector("#medisin-recovery-reset").disabled,
      "Reset should only become available after the raw backup action");
    root.querySelector("#medisin-recovery-reset").click();
    assert(confirmCalls===1&&localStorage.getItem(corruptKey)===damaged,
      "Declining explicit reset must preserve original local bytes");
    decision=true;
    root.querySelector("#medisin-recovery-reset").click();
    assert(localStorage.getItem(corruptKey)===null,
      "Confirmed profile reset did not clear invalid local JSON");
    assert(root.querySelector("#medisin-corrupt-recovery").hidden,
      "Editor did not reopen after explicit recovery reset");
    lockedForm.elements.name.value="Recovered synthetic timer";
    lockedForm.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
    assert(localStorage.getItem(corruptKey)?.includes("Recovered synthetic timer"),
      "Recovered profile cannot save new data");
  }finally{window.confirm=oldConfirm;}
  protectedMount.cleanup();
  localStorage.removeItem(corruptKey);

  // Two separately mounted tab-like views begin empty. A stale commit in B
  // must not overwrite A; a tombstone made by A must survive B's stale edit.
  const secondRoot=document.createElement("div");
  document.body.append(secondRoot);
  root.innerHTML=medisinPageHTML();
  secondRoot.innerHTML=medisinPageHTML();
  const tabA=mountMedisin(root),tabB=mountMedisin(secondRoot);
  const submit=(host,name)=>{
    const form=host.querySelector("#medisin-add-form");
    form.elements.name.value=name;
    form.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  };
  submit(root,"Tab A original");
  submit(secondRoot,"Tab B stale");
  let persisted=JSON.parse(localStorage.getItem(corruptKey));
  assert(persisted.entries.filter(e=>e.type==="timer"&&!e.deleted).length===2,
    "Stale second tab overwrote first tab record");
  const aId=persisted.entries.find(e=>e.name==="Tab A original").id;
  const oldConfirmTabs=window.confirm;
  window.confirm=()=>true;
  try{
    const removeA=root.querySelector('[data-medisin-delete="'+aId+'"]');
    assert(removeA,"Tab A card removal button missing");
    removeA.click();
    submit(secondRoot,"Tab B after deletion");
    persisted=JSON.parse(localStorage.getItem(corruptKey));
    assert(persisted.entries.find(e=>e.id===aId).deleted===true,
      "Second tab resurrected deleted record from stale state");
    assert(persisted.entries.filter(e=>e.type==="timer"&&!e.deleted).length===2,
      "Sequential stale-tab reconciliation lost a timer");
  }finally{window.confirm=oldConfirmTabs;}
  window.dispatchEvent(new StorageEvent("storage",{
    key:corruptKey,newValue:localStorage.getItem(corruptKey),
    storageArea:localStorage,url:location.href
  }));
  assert(root.querySelectorAll("[data-medisin-timer]").length===2,
    "External storage event did not refresh the first tab");
  tabA.cleanup();tabB.cleanup();secondRoot.remove();
  localStorage.removeItem(corruptKey);

  // Separate integration regression: sign-in alone must not upload
  // health information as unencrypted Drive JSON.
  const cloudSub="medisin-browser-fixture";
  const cloudKey="folk-medisin-v2:google:"+cloudSub;
  localStorage.removeItem(cloudKey);
  localStorage.removeItem(medisinCloudConsentKey(cloudSub));
  let driveRequests=0,uploads=0,uploadBody="",remoteVault=null,patches=0;
  const originalFetch=window.fetch.bind(window);
  const originalConfirm=window.confirm;
  window.__FOLK_GOOGLE_AUTH_CONFIG__={clientId:"12345-fixture.apps.googleusercontent.com"};
  window.google={accounts:{oauth2:{
    initTokenClient:()=>({
      callback:null,
      requestAccessToken(){queueMicrotask(()=>this.callback({access_token:"fixture-token",expires_in:3600}))}
    }),
    revoke:(token,done)=>done?.()
  }}};
  window.fetch=async(input,options)=>{
    const url=String(typeof input==="string"?input:input?.url||"");
    if(url.includes("openidconnect.googleapis.com/v1/userinfo"))
      return new Response(JSON.stringify({sub:cloudSub,name:"Test",email:"test@example.invalid"}),{
        status:200,headers:{"Content-Type":"application/json"}});
    if(url.includes("www.googleapis.com/drive/v3/files")){
      driveRequests++;
      if(url.includes("alt=media")){
        return new Response(remoteVault??"{}",{
          status:remoteVault?200:404,headers:{"Content-Type":"application/json"}});
      }
      return new Response(JSON.stringify({files:remoteVault?[{id:"test-file",name:"vault.enc.json"}]:[]}),{
        status:200,headers:{"Content-Type":"application/json"}});
    }
    if(url.includes("www.googleapis.com/upload/drive/v3/files")){
      if(options?.method==="PATCH"){
        patches++;
        remoteVault=String(options?.body||"");
      }else{
        uploads++;
        uploadBody=String(options?.body||"");
        const start=uploadBody.indexOf('{"format":"folk-medisin-vault"');
        const end=uploadBody.indexOf("\r\n--folkMedisinEncrypted",start);
        if(start>=0&&end>start)remoteVault=uploadBody.slice(start,end);
      }
      return new Response(JSON.stringify({id:"test-file"}),{
        status:200,headers:{"Content-Type":"application/json"}});
    }
    return originalFetch(input,options);
  };
  window.confirm=()=>true;
  try{
    await connectGoogleSession();
    root.innerHTML=medisinPageHTML();
    const cloudMount=mountMedisin(root);
    await new Promise(resolve=>setTimeout(resolve,150));
    assert(driveRequests===0&&uploads===0,"Sign-in must not automatically touch Drive");
    assert(root.querySelector("#medisin-sync").textContent.includes("Aktiver"),
      "Drive sync must require explicit enabling");
    const cloudForm=root.querySelector("#medisin-add-form");
    cloudForm.elements.name.value="Synthetic test timer";
    cloudForm.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
    await new Promise(resolve=>setTimeout(resolve,80));
    assert(driveRequests===0&&uploads===0,"Local edits must stay local until opt-in");
    const testPassphrase="private test passphrase for browser smoke";
    const folder=root.querySelector("#medisin-drive-folder");
    folder.value="sampleSharedFolderId123456789";
    root.querySelector("#medisin-folder-save").click();
    root.querySelector("#medisin-vault-passphrase").value=testPassphrase;
    root.querySelector("#medisin-sync").click();
    // PBKDF2 310k iterations can be slow on shared CI Chrome runners.
    for(let i=0;i<500&&!uploads;i++)await new Promise(resolve=>setTimeout(resolve,30));
    assert(uploads===1,"After opt-in, one encrypted Drive backup must be written. Debug "+JSON.stringify({uploads,driveRequests,feedback:root.querySelector("#medisin-feedback")?.textContent,status:root.querySelector("#medisin-sync-status")?.textContent,local:localStorage.getItem(cloudKey)?.slice(0,90)}));
    assert(!uploadBody.includes("Synthetic test timer"),
      "Sensitive timer data leaked into the Drive multipart body in plaintext");
    assert(uploadBody.includes("sampleSharedFolderId123456789"),"Shared folder was not used");
    const start=uploadBody.indexOf('{"format":"folk-medisin-vault"');
    const end=uploadBody.indexOf("\r\n--folkMedisinEncrypted",start);
    assert(start>=0&&end>start,"Encrypted vault envelope was not included in upload");
    const decrypted=await decryptMedisinVault(JSON.parse(uploadBody.slice(start,end)),testPassphrase);
    assert(decrypted.entries.some(e=>e.name==="Synthetic test timer"),
      "Drive ciphertext could not be decrypted back into the correct timer");
    // Model two remote devices: B reads revision V1; A updates the remote
    // vault; B must refuse to overwrite A's ciphertext with a stale version.
    const revisionRead=await readEncryptedMedisinDriveBackup(cloudSub,testPassphrase,{
      folderId:"sampleSharedFolderId123456789"
    });
    assert(revisionRead?.revision&&revisionRead.backup.entries.length===1,
      "Remote revision snapshot not read");
    const competing=newMedisinBackup([...revisionRead.backup.entries,{
      id:"competing-device",type:"timer",name:"Synthetic second device",
      durationSeconds:86400,halfLifeSeconds:0,amount:1,unit:"mg",
      updatedAt:new Date().toISOString()
    }]);
    remoteVault=JSON.stringify(await encryptMedisinVault(competing,testPassphrase));
    let conflict="";
    try{
      await writeEncryptedMedisinDriveBackup(cloudSub,testPassphrase,revisionRead.backup,{
        folderId:"sampleSharedFolderId123456789",allowReplace:true,
        expectedRevision:revisionRead.revision
      });
    }catch(error){conflict=String(error?.message||error);}
    assert(conflict.includes("endret av en annen enhet"),
      "Stale remote snapshot did not cause conflict refusal: "+conflict);
    assert(patches===0,"Stale device issued destructive PATCH despite conflicting revision");
    const preserved=await decryptMedisinVault(JSON.parse(remoteVault),testPassphrase);
    assert(preserved.entries.some(e=>e.id==="competing-device"),
      "Concurrent remote synthetic entry disappeared");
    const disable=root.querySelector("#medisin-cloud-disable");
    assert(disable.hidden===false,"Revocation control not visible");
    for(let i=0;i<50&&disable.disabled;i++)await new Promise(resolve=>setTimeout(resolve,20));
    assert(!disable.disabled,"Cloud sync never returned to idle");
    disable.click();
    assert(root.querySelector("#medisin-cloud-disable").hidden===true,"Revocation did not take effect");
    const count=driveRequests;
    cloudForm.elements.name.value="Another synthetic timer";
    cloudForm.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
    await new Promise(resolve=>setTimeout(resolve,1100));
    assert(driveRequests===count,"Cloud sync must stop after revocation");
    cloudMount.cleanup();
  }finally{
    disconnectGoogleSession();
    window.fetch=originalFetch;
    window.confirm=originalConfirm;
    delete window.google;
    delete window.__FOLK_GOOGLE_AUTH_CONFIG__;
    localStorage.removeItem(cloudKey);
    localStorage.removeItem(medisinCloudConsentKey(cloudSub));
    localStorage.removeItem("folk-medisin-v2:drive-folder:"+cloudSub);
  }
  document.body.dataset.status="pass";
  document.querySelector("#result").textContent="MedisinTimer E2EE AES-GCM Drive vault, shared folder, opt-in and revocation: PASS";
}catch(error){
  document.body.dataset.status="fail";
  document.querySelector("#result").textContent=String(error?.stack||error);
}
</script></body></html>
