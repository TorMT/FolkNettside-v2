<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Settings app browser smoke</title></head>
<body data-status="running">
<iframe id="app-frame" src="../../index.html#/settings" style="width:1200px;height:800px"></iframe>
<pre id="result">running</pre>
<script type="module">
const frame=document.querySelector("#app-frame");
const result=document.querySelector("#result");
const assert=(condition,message)=>{if(!condition)throw new Error(message)};
const waitFor=async(predicate,label,timeout=15000)=>{
  const started=performance.now();
  while(performance.now()-started<timeout){
    try{if(predicate())return}catch{}
    await new Promise(resolve=>setTimeout(resolve,50));
  }
  throw new Error("Timed out waiting for "+label);
};

try{
  await waitFor(()=>frame.contentDocument?.querySelector('[data-settings-panel="appearance"]'),"Settings appearance panel");
  const doc=frame.contentDocument;
  const win=frame.contentWindow;
  const consent=doc.querySelector(".analytics-consent-notice");
  assert(consent,"New visits need an optional analytics consent choice");
  assert(doc.querySelectorAll('script[data-folk-analytics]').length===0,
    "No Google Analytics script before a first-visit choice");
  assert(!(win.dataLayer||[]).some(args=>args[0]==="config"||args[0]==="event"),
    "No GA4 config or page view before the choice");
  assert(!doc.querySelector('iframe[src*="lookerstudio"]'),
    "V2 must never expose the legacy public statistics dashboard");
  const controls=[...consent.querySelectorAll(".analytics-consent-actions button")];
  assert(controls.length===3,"The notice must offer full, limited and no-statistics options");
  assert(consent.textContent.includes("cookie-free")&&consent.textContent.includes("network/device"),
    "The limited measurement must disclose Google network metadata");
  controls[2].click(); // No statistics, not just no cookies.
  assert(win.localStorage.getItem("folk.analytics.consent.v1")==="denied",
    "Complete refusal choice must persist");
  assert(doc.querySelectorAll('script[data-folk-analytics]').length===0,
    "Complete refusal must remain network-silent from a fresh page");

  doc.querySelector('[data-settings-section="privacy"]').click();
  await waitFor(()=>frame.contentDocument?.querySelector('[data-settings-panel="privacy"]'),"Privacy panel");
  const privacy=frame.contentDocument;
  assert(privacy.querySelector("[data-analytics-status]")?.textContent.includes("No statistics"),
    "Privacy Settings must show actual no-statistics choice");
  assert(privacy.querySelectorAll("[data-analytics-choice]").length===3,
    "Privacy Settings must let visitors move between three measurement tiers");
  const assertChoiceHighlighted=selected=>{
    const buttons=[...privacy.querySelectorAll("[data-analytics-choice]")];
    const pressed=buttons.filter(button=>button.getAttribute("aria-pressed")==="true");
    assert(pressed.length===1&&pressed[0].dataset.analyticsChoice===selected,
      "Only the chosen tracking option should be marked pressed: "+selected);
    const unselected=buttons.find(button=>button!==pressed[0]);
    const activeStyle=win.getComputedStyle(pressed[0]);
    const idleStyle=win.getComputedStyle(unselected);
    assert(activeStyle.backgroundColor!==idleStyle.backgroundColor,
      "Selected tracking option needs a visibly different background");
    assert(activeStyle.borderColor!==idleStyle.borderColor,
      "Selected tracking option needs a visibly different border");
    assert(activeStyle.fontWeight!==idleStyle.fontWeight,
      "Selected tracking option needs stronger visual weight");
  };
  assertChoiceHighlighted("denied");
  privacy.querySelector('[data-analytics-choice="limited"]').click();
  assertChoiceHighlighted("limited");
  const html=privacy.documentElement;
  const originalMode=html.dataset.mode;
  html.dataset.mode="dark";
  assertChoiceHighlighted("limited");
  if(originalMode===undefined)delete html.dataset.mode;
  else html.dataset.mode=originalMode;
  assert(win.localStorage.getItem("folk.analytics.consent.v1")==="limited",
    "Limited tier must persist as a separate, explicit choice");
  assert(doc.querySelectorAll('script[data-folk-analytics]').length===1,
    "Limited choice should load exactly one Google script");
  const calls=[...(win.dataLayer||[])];
  assert(calls.some(args=>args[0]==="consent"&&args[1]==="default"&&
    args[2]?.analytics_storage==="denied"),"Limited mode must deny analytics cookies");
  assert(calls.some(args=>args[0]==="event"&&args[1]==="page_view"),
    "Limited mode should submit coarse manual page views");
  assert(!calls.some(args=>args[0]==="event"&&
    /\/(medisin|diving|brewing)/.test(JSON.stringify(args))),
    "Medical/private page names must not appear in analytic events");
  privacy.querySelector('[data-analytics-choice="denied"]').click();
  assertChoiceHighlighted("denied");
  assert(privacy.querySelector("[data-analytics-status]").textContent.includes("No statistics"),
    "Full refusal after limited measurement must visibly stop manual tracking");

  // Restoring an approved local JSON backup works without OAuth, cloud
  // access or a page reload. Newer local video progress must win conflicts.
  const importButton=privacy.querySelector("#settings-choose-study-import");
  const importInput=privacy.querySelector("#settings-import-study-progress");
  const exportButton=privacy.querySelector("#settings-export-study-progress");
  assert(importButton?.tagName==="BUTTON"&&exportButton?.tagName==="BUTTON",
    "Import and export must be keyboard-focusable real buttons");
  assert(importInput?.type==="file",
    "Import must use the browser's local file picker");
  const localVideo=JSON.stringify({
    position:60,duration:120,watched:false,updatedAt:600
  });
  win.localStorage.setItem("folk-v2-video:smoke",localVideo);
  win.localStorage.setItem("folknet:quiz:smoke",JSON.stringify({
    version:1,quizVersion:2,answers:[null],completed:false,updatedAt:100
  }));
  const backupPayload={
    format:"folk-v2-study-progress",schemaVersion:1,
    exportedAt:"2026-11-01T12:00:00.000Z",
    records:[
      {key:"folk-v2-video:smoke",value:JSON.stringify({
        position:12,duration:120,watched:false,updatedAt:200
      })},
      {key:"folknet:quiz:smoke",value:JSON.stringify({
        version:1,quizVersion:2,answers:[0],completed:true,updatedAt:900
      })},
      {key:"folk-v2-video:restored",value:JSON.stringify({
        position:8,duration:80,watched:false,updatedAt:100
      })}
    ]
  };
  const chooseBackup=(value,name="study-backup.json")=>{
    const transfer=new win.DataTransfer();
    transfer.items.add(new win.File([JSON.stringify(value)],name,{
      type:"application/json"
    }));
    importInput.files=transfer.files;
    importInput.dispatchEvent(new win.Event("change",{bubbles:true}));
  };
  const previousConfirm=win.confirm;
  try{
    win.confirm=()=>true;
    chooseBackup(backupPayload);
    await waitFor(()=>win.localStorage.getItem("folk-v2-video:restored")!==null,
      "Local study progress import");
    assert(win.localStorage.getItem("folk-v2-video:smoke")===localVideo,
      "Older imported video state must not overwrite newer local progress");
    assert(JSON.parse(win.localStorage.getItem("folknet:quiz:smoke")).completed===true,
      "Newer quiz attempt should be imported");
    assert(privacy.querySelector("#settings-feedback")?.textContent.includes("Restored 2 records"),
      "Import result must report merged and preserved records");
    await waitFor(()=>!importInput.disabled,"Import file picker enabled after completion");
    const beforeInvalid=win.localStorage.getItem("folknet:quiz:smoke");
    chooseBackup({...backupPayload,records:[
      ...backupPayload.records,
      {key:"folk-v2-dive-log-v1",value:"{}"}
    ]},"invalid.json");
    await waitFor(()=>privacy.querySelector("#settings-feedback")?.textContent.includes("Import failed"),
      "Malformed backup feedback");
    assert(win.localStorage.getItem("folknet:quiz:smoke")===beforeInvalid,
      "Invalid import must not partially modify quiz records");
  }finally{
    win.confirm=previousConfirm;
  }
  const settingsBefore=win.localStorage.getItem("folk-v2-settings");
  const clearProgress=frame.contentDocument.querySelector("#settings-clear-study-progress");
  const originalConfirmClear=win.confirm;
  let clearConfirmations=0;
  try{
    // An accidental click or explicit Cancel must not destroy the data.
    win.confirm=message=>{
      clearConfirmations++;
      assert(message.includes("cannot be undone")&&message.includes("backup"),
        "Destructive clear must warn about lost progress and backup");
      return false;
    };
    clearProgress.click();
    assert(clearConfirmations===1,"Clear progress did not require confirmation");
    assert(win.localStorage.getItem("folk-v2-video:smoke")===localVideo,
      "Cancel must preserve video position");
    assert(win.localStorage.getItem("folk-v2-video:restored")!==null,
      "Cancel must preserve imported video progress");
    assert(win.localStorage.getItem("folknet:quiz:smoke")!==null,
      "Cancel must preserve quiz attempts");
    assert(privacy.querySelector("#settings-feedback").textContent.includes("cancelled"),
      "Clear cancellation must give visible feedback");
    assert(clearProgress.textContent==="Clear progress",
      "Cancel must not relabel the button as Cleared");
    win.confirm=()=>{clearConfirmations++;return true};
    clearProgress.click();
    assert(clearConfirmations===2,"Confirmed clear should require a new confirmation");
    assert(win.localStorage.getItem("folk-v2-video:smoke")===null,
      "Confirmed clear must remove video progress");
    assert(win.localStorage.getItem("folknet:quiz:smoke")===null,
      "Confirmed clear must remove quiz attempts");
    assert(win.localStorage.getItem("folk-v2-video:restored")===null,
      "Confirmed clear must remove imported video progress");
    assert(win.localStorage.getItem("folk-v2-settings")===settingsBefore,
      "Confirmed clear must not remove settings");
  }finally{
    win.confirm=originalConfirmClear;
  }

  frame.contentDocument.querySelector('[data-settings-section="appearance"]').click();
  await waitFor(()=>frame.contentDocument?.querySelector('[data-settings-panel="appearance"]'),"Appearance panel after navigation");
  const compact=frame.contentDocument.querySelector('[data-setting="density"][data-value="compact"]');
  assert(compact,"Compact density control missing");
  compact.click();
  await waitFor(()=>frame.contentDocument.documentElement.dataset.density==="compact","compact density apply");
  assert(frame.contentDocument.querySelector('[data-setting="density"][data-value="compact"]').classList.contains("active"),"Compact density did not stay active");

  frame.contentDocument.querySelector('[data-setting="density"][data-value="comfortable"]').click();
  await waitFor(()=>frame.contentDocument.documentElement.dataset.density==="comfortable","density restore");

  frame.contentDocument.querySelector('[data-settings-section="engineering"]').click();
  await waitFor(()=>frame.contentDocument?.querySelector('[data-settings-panel="engineering"]'),"Engineering settings");
  const eng=frame.contentDocument;
  assert(eng.querySelector('[data-spacemouse-setting="navigation"]').value==="object",
    "SpaceMouse should default to Fusion-like object navigation");
  const nav=eng.querySelector('[data-spacemouse-setting="navigation"]');
  nav.value="camera";nav.dispatchEvent(new Event("change",{bubbles:true}));
  const rev=eng.querySelector('[data-spacemouse-setting="invertTilt"]');
  rev.checked=true;rev.dispatchEvent(new Event("change",{bubbles:true}));
  const saved=JSON.parse(win.localStorage.getItem("folk-v2-spacemouse:v1"));
  assert(saved.navigation==="camera"&&saved.invertTilt===true,
    "Per-axis SpaceMouse settings not saved");
  eng.querySelector("[data-spacemouse-reset]").click();
  await waitFor(()=>frame.contentDocument.querySelector('[data-spacemouse-setting="navigation"]')?.value==="object",
    "SpaceMouse reset");
  assert(win.localStorage.getItem("folk-v2-spacemouse:v1")===null,
    "Reset must restore defaults, not persist a second conflicting profile");

  document.body.dataset.status="pass";
  result.textContent="settings-app-smoke: pass";
}catch(error){
  document.body.dataset.status="fail";
  result.textContent=String(error?.stack||error);
}
</script>
</body>
</html>
