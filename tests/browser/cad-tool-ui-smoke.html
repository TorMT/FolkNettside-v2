<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../assets/style.css">
<link rel="stylesheet" href="../../assets/engineering.css">
<link rel="stylesheet" href="../../assets/viewer-enhancements.css">
<title>Standalone CAD workbench smoke</title></head>
<body data-status="running"><div id="host"></div><pre id="result">running</pre>
<script type="module">
import {cadToolHTML,mountCADTool} from "../../src/engineering/cad-tool.js";
try{
 const host=document.querySelector("#host");
 host.innerHTML=cadToolHTML();
 const cleanup=mountCADTool(host);
 const local=host.querySelector(".cad-fusion-quickstart");
 if(!local||!local.textContent.includes("No APS account or cloud upload required"))
   throw Error("Local Fusion first-run flow is missing");
 if(!host.querySelector("#cad-fusion-install")||
    !host.querySelector('a[href="./scripts/fusion_export_folknet.py"]'))
   throw Error("Local Fusion installation and manual fallback not visible");
 const zone=host.querySelector("#cad-drop-zone");
 if(!zone||zone.getAttribute("for")!=="cad-import-file")
   throw Error("Accessible file drop/choose area missing");
 if(host.querySelector(".cad-hub-advanced")?.open)
   throw Error("Inactive APS Hub must be collapsed by default");
 if(host.querySelector("#cad-fusion-hub-browser")?.children.length)
   throw Error("Inactive APS Hub must not initialize until opened");
 const munin=host.querySelector(".cad-example-munin");
 if(!munin||!munin.textContent.includes("Munin"))throw Error("Munin CAD example missing");
 if(munin.querySelectorAll("a[href^='https://tormt.folk.ntnu.no/diverse/Njord/']").length!==3)
   throw Error("Munin public source links unavailable");
 if(!host.querySelector("[data-cad-munin-choose]"))throw Error("Munin local import missing");
 const stage=host.querySelector("#cad-geometry-stage");
 if(stage.clientHeight<350||stage.clientWidth<300)
   throw Error("CAD stage has no usable geometry: "+stage.clientWidth+"x"+stage.clientHeight);
 const demo=host.querySelector("[data-cad-demo]");
 if(!demo)throw Error("Demo assembly missing");
 demo.click();
 for(let i=0;i<160&&!host.querySelector(".three-canvas");i++)
   await new Promise(resolve=>setTimeout(resolve,90));
 const canvas=host.querySelector(".three-canvas");
 if(!canvas)throw Error("3D canvas failed to mount: "+host.querySelector("#cad-import-status")?.textContent);
 await new Promise(resolve=>setTimeout(resolve,200));
 if(canvas.clientHeight<330||canvas.clientWidth<200)
   throw Error("CAD canvas collapsed: "+canvas.clientWidth+"x"+canvas.clientHeight);
 if(matchMedia("(max-width:900px)").matches){
   const toggle=host.querySelector("[data-model-mobile-toggle]");
   const inspector=host.querySelector(".model-viewer-inspector");
   if(!toggle||!inspector||getComputedStyle(toggle).display==="none")
     throw Error("Mobile CAD inspector toggle is missing");
   if(toggle.getAttribute("aria-expanded")!=="false"||
     getComputedStyle(inspector).display!=="none")
     throw Error("Mobile tools must start collapsed to prioritize 3D view");
   toggle.click();
   if(toggle.getAttribute("aria-expanded")!=="true"||
     getComputedStyle(inspector).display==="none")
     throw Error("Mobile inspector cannot be opened");
   const sw=Math.max(document.documentElement.scrollWidth,document.body.scrollWidth);
   const vw=document.documentElement.clientWidth;
   if(sw>vw+8)throw Error("Mobile CAD horizontal overflow "+sw+"/"+vw);
 }
 if(!host.querySelector("[data-model-fit]")||!host.querySelector("[data-model-spacemouse]"))
   throw Error("Workbench camera/SpaceMouse actions missing");
 host.querySelector("[data-model-fit]").click();
 canvas.focus();
 canvas.dispatchEvent(new KeyboardEvent("keydown",{key:"i",bubbles:true,cancelable:true}));
 const status=host.querySelector("#cad-import-status").textContent;
 if(!status.includes("2 components"))throw Error("Demo mount failed: "+status);
 document.body.dataset.status="pass";
 document.querySelector("#result").textContent="CAD live viewport, demo assembly, Fit and SpaceMouse controls ready";
 cleanup();
}catch(error){
 document.body.dataset.status="fail";
 document.querySelector("#result").textContent=String(error?.stack||error);
}
</script></body></html>
