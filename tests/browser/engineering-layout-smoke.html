<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Engineering layout smoke</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../../assets/engineering.css">
</head>
<body data-status="running">
  <header class="topbar"><strong>FolkNettside</strong></header>
  <main class="workspace">
    <div class="workspace-bar"><strong>Long assembly fixture</strong></div>
    <aside class="tree" id="tree"></aside>
    <section class="viewport"></section>
    <aside class="inspector" id="inspector"></aside>
    <section class="results" id="results"><div class="results-summary">Summary</div><div class="chart" id="results-body"></div></section>
    <footer class="statusbar" id="status"><span>Units SI</span><span>Semantic ModelDocument</span><span class="top-spacer"></span><span>Ready</span></footer>
  </main>
  <pre id="result" style="position:fixed;left:-10000px;top:0;margin:0">running</pre>
<script type="module">
import {mountWorkspaceResultsResize} from "../../src/shell/workspace-resizer.js";
const tree=document.querySelector("#tree");
const inspector=document.querySelector("#inspector");
for(let i=0;i<90;i++) tree.insertAdjacentHTML("beforeend", `<div class="tree-row"><span>○</span>Component ${i+1}</div>`);
for(let i=0;i<30;i++) inspector.insertAdjacentHTML("beforeend", `<div class="readout"><span>Field ${i+1}</span><strong>Value</strong></div>`);
const results=document.querySelector("#results");
for(let i=0;i<100;i++)document.querySelector("#results-body").insertAdjacentHTML("beforeend",`<p>Calculated result ${i+1}: 123.456</p>`);
mountWorkspaceResultsResize(document.querySelector(".workspace"));

function runLayoutCheck(){
  const status=document.querySelector("#status");
  const statusRect=status.getBoundingClientRect();
  const bodyFits=document.documentElement.scrollHeight<=window.innerHeight+1;
  const treeScrolls=tree.scrollHeight>tree.clientHeight;
  const inspectorScrolls=inspector.scrollHeight>inspector.clientHeight;
  const resultsScrolls=results.scrollHeight>results.clientHeight;
  const handle=results.querySelector(".workspace-results-handle");
  const hasResizeHandle=Boolean(handle&&getComputedStyle(handle).cursor==="ns-resize");
  const initial=results.getBoundingClientRect().height;
  handle?.dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowUp",bubbles:true}));
  const grew=results.getBoundingClientRect().height>initial+15;
  handle?.dispatchEvent(new KeyboardEvent("keydown",{key:"Home",bubbles:true}));
  results.scrollTop=100;
  const independentResultScroll=results.scrollTop>0&&document.documentElement.scrollTop===0;
  const statusAtBottom=Math.abs(statusRect.bottom-window.innerHeight)<=1.5;
  const workspaceFits=document.querySelector(".workspace").getBoundingClientRect().bottom<=window.innerHeight+1;

  const pass=bodyFits&&treeScrolls&&inspectorScrolls&&resultsScrolls&&independentResultScroll&&hasResizeHandle&&grew&&statusAtBottom&&workspaceFits;
  document.body.dataset.status=pass?"pass":"fail";
  document.querySelector("#result").textContent=JSON.stringify({
    bodyFits,treeScrolls,inspectorScrolls,resultsScrolls,independentResultScroll,hasResizeHandle,grew,statusAtBottom,workspaceFits,
    scrollHeight:document.documentElement.scrollHeight,
    innerHeight:window.innerHeight,
    statusBottom:statusRect.bottom
  });
}
if(document.readyState==="complete")runLayoutCheck();
else window.addEventListener("load",runLayoutCheck,{once:true});
</script>
</body>
</html>
