<!doctype html><html lang="en"><meta charset="utf-8"><title>KISSsoft V2 smoke</title>
<body data-status="running"><pre id="result">running</pre>
<script type="module">
import {parseKisssoftBuffer} from "../../src/engineering/kisssoft-core.js";
import {kisssoftPageHTML,mountKisssoft,kisssoftSummary,mountKisssoftVisual} from "../../src/engineering/kisssoft-tool.js";
import {viewerKind,loadAdapter} from "../../src/viewers/registry.js";
const sample="KSOFTVERSION=2026 -SP1¶MODULE=Z014¶ZR[0].z=25¶ZR[1].z=35¶ZR[2].z=-95¶ZR[0].b=35¶ZR[1].b=35¶ZR[2].b=35¶ZS.Geo.mn=2¶ZS.Geo.beta=0¶";
const bytes=new Uint8Array([255,254,...Array.from(sample).flatMap(c=>[c.charCodeAt(0)&255,c.charCodeAt(0)>>8])]);
try{
 const model=parseKisssoftBuffer(bytes.buffer,"Stage3PlanetaryGear.Z14");
 if(model.centerDistance!==60||model.consistent!==true)throw Error("Geometry calculation mismatch");
 for(const ext of ["Z12","Z14","W10","KSYS"])if(viewerKind({path:"test."+ext})!=="kisssoft")throw Error("Adapter missing "+ext);
 document.body.innerHTML=kisssoftPageHTML()+'<pre id="result">running</pre>';
 const cleanupEngineering=mountKisssoft(document.body);
 const input=document.querySelector("#kisssoft-file");
 const file=new File([bytes],"Stage3PlanetaryGear.Z14",{type:"application/octet-stream"});
 const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;
 input.dispatchEvent(new Event("change",{bubbles:true}));
 await new Promise(resolve=>setTimeout(resolve,150));
 if(!document.querySelector(".kisssoft-summary svg"))throw Error("Engineering view not rendered");
 for(let i=0;i<120&&!document.querySelector("[data-kisssoft-3d] canvas");i++)await new Promise(resolve=>setTimeout(resolve,100));
 if(!document.querySelector("[data-kisssoft-3d] canvas"))throw Error("Interactive Three.js 3D gear model did not mount");
 const housing=document.querySelector("[data-gear-housing]");
 const carrier=document.querySelector("[data-gear-carrier]");
 const explode=document.querySelector("[data-gear-explode]");
 if(!housing||!carrier||!explode)throw Error("Assembly concept controls are missing");
 housing.checked=false;housing.dispatchEvent(new Event("input",{bubbles:true}));
 carrier.checked=false;carrier.dispatchEvent(new Event("input",{bubbles:true}));
 explode.value="70";explode.dispatchEvent(new Event("input",{bubbles:true}));
 if(!document.querySelector("[data-kisssoft-3d] canvas"))throw Error("WebGL scene disappeared after control input");
 document.querySelector("#kisssoft-rotation").value="45";
 document.querySelector("#kisssoft-rotation").dispatchEvent(new Event("input",{bubbles:true}));
 if(!document.querySelector("#kisssoft-rotation"))throw Error("Rotation slider unmounted");
 const canvas=document.querySelector("[data-kisssoft-3d] canvas");
 const pause=document.querySelector("[data-gear-play]");
 if(!pause)throw Error("Gear animation control missing");
 if(pause.textContent.includes("Play"))pause.click();
 const start=Number(canvas.dataset.sunAngle||0);
 await new Promise(resolve=>setTimeout(resolve,500));
 const end=Number(canvas.dataset.sunAngle||0);
 if(!(end>start))throw Error("Gear animation is not turning");
 const carrierAngle=Number(canvas.dataset.carrierAngle||0);
 const planetAngle=Number(canvas.dataset.planetSpin||0);
 if(Math.abs(carrierAngle/end-25/120)>1e-8)throw Error("Carrier ratio incorrect");
 if(Math.abs(planetAngle/end+(25/35)*(1-25/120))>1e-8)throw Error("Planet ratio incorrect");
 pause.click();
 const stopped=Number(canvas.dataset.sunAngle);
 await new Promise(resolve=>setTimeout(resolve,170));
 if(Number(canvas.dataset.sunAngle)!==stopped)throw Error("Pause did not stop rotation");
 cleanupEngineering();
 const courseResource={
   kind:"FILE",path:"./example-course/Stage3PlanetaryGear.Z14",name:"Stage3PlanetaryGear.Z14",
   label:"KISSsoft planetary",semester:5,courseCode:"TMR4182",section:"Gear design"
 };
 const adapter=await loadAdapter(courseResource);
 if(adapter.kind!=="kisssoft")throw Error("KISSsoft file not registered in Courses");
 const originalFetch=window.fetch.bind(window);
 window.fetch=async path=>String(path).endsWith(".Z14")?new Response(bytes,{status:200}):originalFetch(path);
 try{
   const host=document.createElement("div");
   document.body.append(host);
   const instance=await adapter.render(host,courseResource);
   if(!host.querySelector(".kisssoft-summary"))throw Error("Course KISSsoft viewer failed");
   instance?.cleanup?.();
   host.remove();
 }finally{window.fetch=originalFetch}

 const pairText="KSOFTVERSION=2026 -SP1¶MODULE=Z012¶ZR[0].z=18¶ZR[1].z=36¶ZR[0].b=30¶ZR[1].b=30¶ZS.Geo.mn=2¶ZS.Geo.beta=20¶";
 const pairBytes=new Uint8Array([255,254,...Array.from(pairText).flatMap(c=>[c.charCodeAt(0)&255,c.charCodeAt(0)>>8])]);
 const pairModel=parseKisssoftBuffer(pairBytes.buffer,"TwoShaftHelical.Z12");
 const pairHost=document.createElement("div");
 pairHost.innerHTML=kisssoftSummary(pairModel);
 document.body.append(pairHost);
 const stopPair=await mountKisssoftVisual(pairHost,pairModel);
 const pairCanvas=pairHost.querySelector("[data-kisssoft-3d] canvas");
 if(!pairCanvas)throw Error("Nonplanetary helical two-shaft model was not displayed");
 const pairPause=pairHost.querySelector("[data-gear-play]");
 if(!pairPause)throw Error("Pair motion button missing");
 if(pairPause.textContent.includes("Play"))pairPause.click();
 const pairStart=Number(pairCanvas.dataset.driverAngle||0);
 await new Promise(resolve=>setTimeout(resolve,500));
 const pairEnd=Number(pairCanvas.dataset.driverAngle||0);
 if(!(pairEnd>pairStart))throw Error("Pair driver did not rotate");
 const ratio=Number(pairCanvas.dataset.drivenAngle||0)/pairEnd;
 if(Math.abs(ratio+.5)>1e-8)throw Error("Wrong two-shaft rotation ratio "+ratio);
 stopPair();pairHost.remove();
 document.body.dataset.status="pass";
 document.querySelector("#result")?.replaceChildren("pass");
}catch(error){document.body.dataset.status="fail";document.querySelector("#result")?.replaceChildren(String(error?.stack||error));}
</script></body></html>
