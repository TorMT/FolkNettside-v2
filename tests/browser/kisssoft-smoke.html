<!doctype html><html lang="en"><meta charset="utf-8"><title>KISSsoft V2 smoke</title>
<body data-status="running"><pre id="result">running</pre>
<script type="module">
import {parseKisssoftBuffer} from "../../src/engineering/kisssoft-core.js";
import {kisssoftPageHTML,mountKisssoft} from "../../src/engineering/kisssoft-tool.js";
import {viewerKind} from "../../src/viewers/registry.js";
const sample="KSOFTVERSION=2026 -SP1¶MODULE=Z014¶ZR[0].z=25¶ZR[1].z=35¶ZR[2].z=-95¶ZR[0].b=35¶ZR[1].b=35¶ZR[2].b=35¶ZS.Geo.mn=2¶ZS.Geo.beta=0¶";
const bytes=new Uint8Array([255,254,...Array.from(sample).flatMap(c=>[c.charCodeAt(0)&255,c.charCodeAt(0)>>8])]);
try{
 const model=parseKisssoftBuffer(bytes.buffer,"Stage3PlanetaryGear.Z14");
 if(model.centerDistance!==60||model.consistent!==true)throw Error("Geometry calculation mismatch");
 for(const ext of ["Z12","Z14","W10","KSYS"])if(viewerKind({path:"test."+ext})!=="kisssoft")throw Error("Adapter missing "+ext);
 document.body.innerHTML=kisssoftPageHTML();
 mountKisssoft(document.body);
 const input=document.querySelector("#kisssoft-file");
 const file=new File([bytes],"Stage3PlanetaryGear.Z14",{type:"application/octet-stream"});
 const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;
 input.dispatchEvent(new Event("change",{bubbles:true}));
 await new Promise(resolve=>setTimeout(resolve,150));
 if(!document.querySelector(".kisssoft-summary svg"))throw Error("Engineering view not rendered");
 for(let i=0;i<120&&!document.querySelector("[data-kisssoft-3d] canvas");i++)await new Promise(resolve=>setTimeout(resolve,100));
 if(!document.querySelector("[data-kisssoft-3d] canvas"))throw Error("Interactive Three.js 3D gear model did not mount");
 document.querySelector("#kisssoft-rotation").value="45";
 document.querySelector("#kisssoft-rotation").dispatchEvent(new Event("input",{bubbles:true}));
 if(!document.querySelector("#kisssoft-rotation"))throw Error("Rotation slider unmounted");
 document.body.dataset.status="pass";
 document.querySelector("#result")?.replaceChildren("pass");
}catch(error){document.body.dataset.status="fail";document.querySelector("#result")?.replaceChildren(String(error?.stack||error));}
</script></body></html>
