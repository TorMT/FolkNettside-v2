<!doctype html><html lang="en"><meta charset="utf-8"><title>KISSsoft V2 smoke</title>
<body data-status="running"><pre id="result">running</pre>
<script type="module">
import {parseKisssoftBuffer} from "../../src/engineering/kisssoft-core.js";
import {kisssoftPageHTML,mountKisssoft,kisssoftSummary,mountKisssoftVisual} from "../../src/engineering/kisssoft-tool.js";
import {viewerKind,loadAdapter} from "../../src/viewers/registry.js";
const sample="KSOFTVERSION=2026 -SP1¶MODULE=Z014¶ZR[0].z=25¶ZR[1].z=35¶ZR[2].z=-95¶ZR[0].b=35¶ZR[1].b=35¶ZR[2].b=35¶ZS.Geo.mn=2¶ZS.Geo.beta=0¶";
const bytes=new Uint8Array([255,254,...Array.from(sample).flatMap(c=>[c.charCodeAt(0)&255,c.charCodeAt(0)>>8])]);
try{
 const model=parseKisssoftBuffer(bytes.buffer,"Stage3PlanetaryGear.Z14");
 if(model.centerDistance!==60||model.consistent!==true)throw Error("Geometry calculation mismatch");
 for(const ext of ["Z12","Z14","Z012","Z014","Z012RS","Z014RS","W10","KSYS"])if(viewerKind({path:"test."+ext})!=="kisssoft")throw Error("Adapter missing "+ext);
 if(viewerKind({path:"PitchInternal.Z012RS(1)"})!=="kisssoft")throw Error("Numbered real KISSsoft file unsupported");
 document.body.innerHTML=kisssoftPageHTML()+'<pre id="result">running</pre>';
 const cleanupEngineering=mountKisssoft(document.body);
 const input=document.querySelector("#kisssoft-file");
 const file=new File([bytes],"Stage3PlanetaryGear.Z14",{type:"application/octet-stream"});
 const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;
 input.dispatchEvent(new Event("change",{bubbles:true}));
 await new Promise(resolve=>setTimeout(resolve,150));
 if(!document.querySelector(".kisssoft-summary svg"))throw Error("Engineering view not rendered");
 for(let i=0;i<120&&!document.querySelector("[data-kisssoft-3d] canvas");i++)await new Promise(resolve=>setTimeout(resolve,100));
 if(!document.querySelector("[data-kisssoft-3d] canvas"))throw Error("Interactive Three.js 3D gear model did not mount");
 const housing=document.querySelector("[data-gear-housing]");
 const carrier=document.querySelector("[data-gear-carrier]");
 const explode=document.querySelector("[data-gear-explode]");
 if(!housing||!carrier||!explode)throw Error("Assembly concept controls are missing");
 housing.checked=false;housing.dispatchEvent(new Event("input",{bubbles:true}));
 carrier.checked=false;carrier.dispatchEvent(new Event("input",{bubbles:true}));
 explode.value="70";explode.dispatchEvent(new Event("input",{bubbles:true}));
 if(!document.querySelector("[data-kisssoft-3d] canvas"))throw Error("WebGL scene disappeared after control input");
 document.querySelector("#kisssoft-rotation").value="45";
 document.querySelector("#kisssoft-rotation").dispatchEvent(new Event("input",{bubbles:true}));
 if(!document.querySelector("#kisssoft-rotation"))throw Error("Rotation slider unmounted");
 const canvas=document.querySelector("[data-kisssoft-3d] canvas");
 if(!document.querySelector("[data-gear-spacemouse]"))
   throw Error("Planetary KISSsoft missing SpaceMouse opt-in control");
 if(canvas.tabIndex!==0)throw Error("Planetary KISSsoft canvas not keyboard focusable");
 canvas.focus();
 canvas.dispatchEvent(new KeyboardEvent("keydown",{key:"x",bubbles:true,cancelable:true}));
 if(Number(explode.value)!==0)throw Error("Planetary KISSsoft keyboard explode toggle failed");
 canvas.dispatchEvent(new KeyboardEvent("keydown",{key:"x",bubbles:true,cancelable:true}));
 if(Number(explode.value)===0)throw Error("Planetary explode not restored");

 const boundaryOnLoad=document.querySelector("[data-gear-boundary]");
 if(boundaryOnLoad?.value!=="ring-fixed")throw Error("Regression: ring-fixed / sun drives must be the default");
 if(document.querySelector("[data-gear-beta]"))throw Error("β must be read from source file, not adjustable");
 if(canvas.dataset.helixBeta!=="0")throw Error("Spur gear preview must use file β=0");
 // The original ring-fixed mode must already be active on first render.
 if(Math.abs(Number(canvas.dataset.ringAngle||0))>1e-12)throw Error("Initial ring should be stationary");
 const pause=document.querySelector("[data-gear-play]");
 if(!pause)throw Error("Gear animation control missing");
 if(pause.textContent.includes("Play"))pause.click();
 const start=Number(canvas.dataset.sunAngle||0);
 for(let tries=0;tries<30&&!document.hidden&&!(Number(canvas.dataset.sunAngle||0)>start);tries++)
   await new Promise(resolve=>setTimeout(resolve,100));
 const end=Number(canvas.dataset.sunAngle||0);
 if(!document.hidden&&!(end>start))
   throw Error("Gear animation is not turning in a visible browser");
 const carrierAngle=Number(canvas.dataset.carrierAngle||0);
 const planetAngle=Number(canvas.dataset.planetSpin||0);
 if(Math.abs(carrierAngle/end-25/120)>1e-8)throw Error("Carrier ratio incorrect");
 if(Math.abs(planetAngle/end+(25/35)*(1-25/120))>1e-8)throw Error("Planet ratio incorrect");
 pause.click();
 const stopped=Number(canvas.dataset.sunAngle);
 await new Promise(resolve=>setTimeout(resolve,170));
 if(Number(canvas.dataset.sunAngle)!==stopped)throw Error("Pause did not stop rotation");
 const settings=document.querySelector("[data-gear-boundary]");
 if(!settings)throw Error("Planetary boundary selection missing");
 settings.value="carrier-fixed";
 settings.dispatchEvent(new Event("change",{bubbles:true}));
 if(pause.textContent.includes("Play"))pause.click();
 await new Promise(resolve=>setTimeout(resolve,290));
 const sourceCanvas=document.querySelector("[data-kisssoft-3d] canvas");
 if(!sourceCanvas||Math.abs(Number(sourceCanvas.dataset.carrierAngle))>1e-12)
   throw Error("Fixed carrier must not spin");
 if(!(Number(sourceCanvas.dataset.ringAngle)<0))
   throw Error("Fixed-carrier ring direction should be opposite to driving sun");
 settings.value="ring-fixed";
 settings.dispatchEvent(new Event("change",{bubbles:true}));

 // The built-in examples must remain loadable independently of the file picker.
 const ringExampleButton=document.querySelector("[data-kisssoft-ring-example]");
 const externalExampleButton=document.querySelector("[data-kisssoft-external-example]");
 if(!ringExampleButton||!externalExampleButton)throw Error("KISSsoft examples were removed");
 ringExampleButton.click();
 for(let tries=0;tries<80&&!document.querySelector(".kisssoft-summary h2")?.textContent.includes("InternalRingAndPinion");tries++)
   await new Promise(resolve=>setTimeout(resolve,100));
 if(!document.querySelector(".kisssoft-summary h2")?.textContent.includes("InternalRingAndPinion.Z012RS"))
   throw Error("Native Z012RS internal example not loaded");
 if(!document.querySelector(".kisssoft-summary svg"))throw Error("Internal example 2D preview missing");
 externalExampleButton.click();
 for(let tries=0;tries<80&&!document.querySelector(".kisssoft-summary h2")?.textContent.includes("HelicalExternalPair");tries++)
   await new Promise(resolve=>setTimeout(resolve,100));
 if(!document.querySelector(".kisssoft-summary h2")?.textContent.includes("HelicalExternalPair.Z12"))
   throw Error("External helical example not loaded");
 if(!document.querySelector(".kisssoft-summary svg"))throw Error("External example 2D preview missing");
 cleanupEngineering();
 const courseResource={
   kind:"FILE",path:"./example-course/Stage3PlanetaryGear.Z14",name:"Stage3PlanetaryGear.Z14",
   label:"KISSsoft planetary",semester:5,courseCode:"TMR4182",section:"Gear design"
 };
 const adapter=await loadAdapter(courseResource);
 if(adapter.kind!=="kisssoft")throw Error("KISSsoft file not registered in Courses");
 const originalFetch=window.fetch.bind(window);
 window.fetch=async path=>String(path).endsWith(".Z14")?new Response(bytes,{status:200}):originalFetch(path);
 try{
   const host=document.createElement("div");
   document.body.append(host);
   const instance=await adapter.render(host,courseResource);
   if(!host.querySelector(".kisssoft-summary"))throw Error("Course KISSsoft viewer failed");
   instance?.cleanup?.();
   host.remove();
 }finally{window.fetch=originalFetch}

 const pairText="KSOFTVERSION=2026 -SP1¶MODULE=Z012¶ZR[0].z=18¶ZR[1].z=36¶ZR[0].b=30¶ZR[1].b=30¶ZS.Geo.mn=2¶ZS.Geo.beta=0.3490658503988659¶";
 const pairBytes=new Uint8Array([255,254,...Array.from(pairText).flatMap(c=>[c.charCodeAt(0)&255,c.charCodeAt(0)>>8])]);
 const pairModel=parseKisssoftBuffer(pairBytes.buffer,"TwoShaftHelical.Z12");
 const pairHost=document.createElement("div");
 pairHost.innerHTML=kisssoftSummary(pairModel);
 document.body.append(pairHost);
 const stopPair=await mountKisssoftVisual(pairHost,pairModel);
 const pairCanvas=pairHost.querySelector("[data-kisssoft-3d] canvas");
 if(!pairHost.querySelector("[data-gear-spacemouse]"))throw Error("External KISSsoft missing SpaceMouse control");
 const pairExplode=pairHost.querySelector("[data-pair-explode]");
 if(!pairExplode)throw Error("External gear-pair explode control missing");
 if(pairHost.querySelector("[data-gear-beta]"))throw Error("External pair β must not be editable");
 if(Math.abs(Number(pairCanvas.dataset.helixBeta)-20)>1e-8)
   throw Error("Imported helical pair did not use β=20° from KISSsoft");
 pairCanvas.focus();
 pairCanvas.dispatchEvent(new KeyboardEvent("keydown",{key:"x",bubbles:true,cancelable:true}));
 if(Number(pairExplode.value)<=0)throw Error("External gear exploded shortcut failed");

 if(!pairCanvas)throw Error("Nonplanetary helical two-shaft model was not displayed");
 const pairPause=pairHost.querySelector("[data-gear-play]");
 if(!pairPause)throw Error("Pair motion button missing");
 if(pairPause.textContent.includes("Play"))pairPause.click();
 const pairStart=Number(pairCanvas.dataset.driverAngle||0);
 for(let tries=0;tries<30&&!document.hidden&&!(Number(pairCanvas.dataset.driverAngle||0)>pairStart);tries++)
   await new Promise(resolve=>setTimeout(resolve,100));
 const pairEnd=Number(pairCanvas.dataset.driverAngle||0);
 if(!document.hidden&&!(pairEnd>pairStart))throw Error("Pair driver did not rotate");
 const ratio=Number(pairCanvas.dataset.drivenAngle||0)/pairEnd;
 if(Math.abs(ratio+.5)>1e-8)throw Error("Wrong two-shaft rotation ratio "+ratio);
 stopPair();pairHost.remove();
 const internalText="KSOFTVERSION=2026¶MODULE=Z012¶ZR[0].z=20¶ZR[1].z=-225¶ZR[0].b=30¶ZR[1].b=40¶ZS.Geo.mn=20¶ZS.Geo.beta=0.2617993877991494¶";
 const internalBytes=new Uint8Array([255,254,...Array.from(internalText).flatMap(c=>[c.charCodeAt(0)&255,c.charCodeAt(0)>>8])]);
 const internal=parseKisssoftBuffer(internalBytes.buffer,"RingAndPinion.Z12");
 const internalHost=document.createElement("div");
 internalHost.innerHTML=kisssoftSummary(internal);
 document.body.append(internalHost);
 const stopInternal=await mountKisssoftVisual(internalHost,internal);
 const internalCanvas=internalHost.querySelector("[data-kisssoft-3d] canvas");
 if(!internalCanvas)throw Error("Internal ring/pinion 3D concept failed to mount");
 if(Math.abs(Number(internalCanvas.dataset.helixBeta)-15)>1e-8)
   throw Error("Internal ring uses file β=15°");
 if(internalCanvas.dataset.meshKind!=="internal")
   throw Error("Signed negative ring teeth did not produce an internal gear");
 const cameraDistance=Number(internalCanvas.dataset.cameraDistance);
 const cameraFar=Number(internalCanvas.dataset.cameraFar);
 if(!(cameraDistance>0&&cameraFar>cameraDistance*1.5))
   throw Error("Internal ring+pinion outside camera clipping planes: "+cameraDistance+" / "+cameraFar);
 if(!Number.isFinite(cameraDistance)||cameraDistance>cameraFar*.65)
   throw Error("Ring gear view is too zoomed out or far-clipped");
 const internalPlay=internalHost.querySelector("[data-gear-play]");
 if(internalPlay.textContent.includes("Play"))internalPlay.click();
 for(let tries=0;tries<30&&!document.hidden&&!(Number(internalCanvas.dataset.driverAngle)>0);tries++)
   await new Promise(resolve=>setTimeout(resolve,100));
 const internalDriver=Number(internalCanvas.dataset.driverAngle);
 const internalDriven=Number(internalCanvas.dataset.drivenAngle);
 if(!document.hidden&&(!(internalDriver>0)||Math.abs(internalDriven/internalDriver-20/225)>1e-8))
   throw Error("Internal mesh kinematic ratio incorrect");
 stopInternal();internalHost.remove();

 document.body.dataset.status="pass";
 document.querySelector("#result")?.replaceChildren("pass");
}catch(error){document.body.dataset.status="fail";document.querySelector("#result")?.replaceChildren(String(error?.stack||error));}
</script></body></html>
