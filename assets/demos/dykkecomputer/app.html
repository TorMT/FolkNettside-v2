<!doctype html>
<html lang="en">
<head>
<script>window.DC_WEB = true;</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dive Computer App</title>
<style>
:root { --bg: #EEF2F4; --surface: #FFFFFF; --ink: #13202B; --muted: #5A6774; --line: #D0D8DE; --accent: #CC3A2E;
  --f-body: system-ui, -apple-system, "Segoe UI", sans-serif; --f-display: system-ui, sans-serif; --f-mono: ui-monospace, Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg: #0C141A; --surface: #141F28; --ink: #E4EAEF; --muted: #93A1AE; --line: #26333F; --accent: #E35A4E; color-scheme: dark } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); padding: 16px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }

</style>
</head>
<body>
<main>
  <h1>Dive computer</h1>
  <p class="lead">Connect over Bluetooth to change settings, download dives as UDDF for Subsurface and install firmware updates. Works in Chrome on Android, Windows and macOS. iPhone needs the native app.</p>
  <div id="app"></div>
  <p class="lead warn" id="nobt" hidden>This browser has no Web Bluetooth. Open the page in Chrome, served over https or from localhost.</p>
</main>
<script>
/*
 * phone.js — the phone app: protocol client, Bluetooth and simulator transports, and the UI.
 * Used by app/index.html (real Bluetooth) and by the simulator page (simulated link).
 * Settings parsing and UDDF export run in the WebAssembly build of the firmware core (`X`).
 */
const DCP = { INFO: 1, GET_SETTINGS: 2, SET_SETTINGS: 3, LIST_LOGS: 4, READ_LOG: 5, LOG_SIZE: 6, LIVE: 7, GET_GEAR: 8, SET_GEAR: 9, TANKS: 0x0A, PREDIVE: 0x0B, SET_PLAN: 0x0C, GET_PLAN: 0x0D, OTA_BEGIN: 0x10, OTA_DATA: 0x11, OTA_END: 0x12, SET_TIME: 0x0E };
const DCP_STATUS = ['OK', 'Bad request', 'Not while diving', 'Not found', 'Checksum error', 'Failed'];
const DC_SVC = '6e400001-d1c0-4c2a-9b1e-7d1f0dc00001';
const DC_RX = '6e400002-d1c0-4c2a-9b1e-7d1f0dc00001';
const DC_TX = '6e400003-d1c0-4c2a-9b1e-7d1f0dc00001';
const DC_STATES = ['Sleeping', 'On the surface', 'Diving', 'Surface interval', 'Charging'];

class DcpError extends Error {}
class DcpOffline extends DcpError {}

class DcpClient {
  constructor(transport) { this.t = transport; this.seq = 0; this.busy = Promise.resolve(); }
  req(cmd, payload = new Uint8Array(0)) {
    const run = async () => {
      this.seq = (this.seq + 1) & 255;
      const r = new Uint8Array(4 + payload.length);
      r[0] = cmd; r[1] = this.seq; r[2] = payload.length & 255; r[3] = payload.length >> 8; r.set(payload, 4);
      const resp = await this.t.send(r);
      if (resp.length < 5 || resp[0] !== (cmd | 0x80) || resp[1] !== this.seq) throw new DcpError('The dive computer sent an unexpected reply.');
      const len = resp[3] | (resp[4] << 8);
      return { status: resp[2], data: resp.slice(5, 5 + len) };
    };
    const p = this.busy.then(run, run);       // one request at a time
    this.busy = p.catch(() => {});
    return p;
  }
  async ok(cmd, payload) {
    const r = await this.req(cmd, payload);
    if (r.status !== 0) throw new DcpError(DCP_STATUS[r.status] || `Error ${r.status}`);
    return r.data;
  }
  async tanks() {
    const d = await this.ok(DCP.TANKS), v = new DataView(d.buffer, d.byteOffset), out = [];
    for (let i = 0; i + 12 <= d.length; i += 12) {
      const dbar = v.getUint16(i + 6, true);
      out.push({ present: d[i] === 1, battery: d[i + 1], serial: v.getUint32(i + 2, true), bar: dbar === 0xFFFF ? null : dbar / 10,
        age: v.getUint16(i + 8, true), gasOn: d[i + 10] === 1 });
    }
    return out;
  }
  async info() {
    const d = await this.ok(DCP.INFO);
    return { proto: d[0], state: d[1], battery: d[2], logs: d[3] | (d[4] << 8), fw: new TextDecoder().decode(d.slice(5)) };
  }
  async live() {
    const d = await this.ok(DCP.LIVE), v = new DataView(d.buffer, d.byteOffset);
    const tank = v.getUint16(7, true);
    return { state: d[0], depth: v.getUint16(1, true) / 100, ndl: d[3], tts: v.getUint16(4, true), gas: d[6],
      tank: tank === 0xFFFF ? null : tank / 10, cns: d[9], alarms: v.getUint16(10, true), deco: d[12] === 1 };
  }
  getSettings() { return this.ok(DCP.GET_SETTINGS); }
  async predive() {
    const d = await this.ok(DCP.PREDIVE), dec = new TextDecoder(), str = (o, n) => { let e = o; while (e < o + n && d[e]) e++; return dec.decode(d.slice(o, e)); };
    const items = [];
    for (let i = 0; i < d[0]; i++) { const o = 2 + i * 49; items.push({ level: d[o], label: str(o + 1, 20), detail: str(o + 21, 28) }); }
    return { worst: d[1], items };
  }
  getPlan() { return this.ok(DCP.GET_PLAN); }
  setPlan(blob) { return this.ok(DCP.SET_PLAN, blob); }
  getGear() { return this.ok(DCP.GET_GEAR); }
  setGear(blob) { return this.ok(DCP.SET_GEAR, blob); }
  setSettings(blob) { return this.ok(DCP.SET_SETTINGS, blob); }
  async listLogs() {
    const d = await this.ok(DCP.LIST_LOGS), v = new DataView(d.buffer, d.byteOffset), out = [];
    for (let o = 0; o + 16 <= d.length; o += 16)
      out.push({ idx: v.getUint16(o, true), no: v.getUint16(o + 2, true), start: v.getUint32(o + 4, true),
        duration: v.getUint32(o + 8, true), maxDepth: v.getUint16(o + 12, true) / 100, deco: d[o + 14] === 1 });
    return out;
  }
  async readLog(idx, onProgress) {
    const sz = await this.ok(DCP.LOG_SIZE, new Uint8Array([idx & 255, idx >> 8]));
    const size = new DataView(sz.buffer, sz.byteOffset).getUint32(0, true);
    const out = new Uint8Array(size);
    let off = 0;
    while (off < size) {
      const want = Math.min(512, size - off);
      const p = new Uint8Array(8), v = new DataView(p.buffer);
      v.setUint16(0, idx, true); v.setUint32(2, off, true); v.setUint16(6, want, true);
      const d = await this.ok(DCP.READ_LOG, p);
      if (!d.length) break;
      out.set(d, off); off += d.length;
      if (onProgress) onProgress(off / size);
    }
    return out.slice(0, off);
  }
  async updateFirmware(bytes, onProgress) {
    const u32 = n => { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, n >>> 0, true); return b; };
    await this.ok(DCP.OTA_BEGIN, u32(bytes.length));
    const chunk = 480;
    for (let off = 0; off < bytes.length; off += chunk) {
      const part = bytes.slice(off, off + chunk), p = new Uint8Array(4 + part.length);
      p.set(u32(off), 0); p.set(part, 4);
      await this.ok(DCP.OTA_DATA, p);
      if (onProgress) onProgress(Math.min(1, (off + part.length) / bytes.length));
    }
    await this.ok(DCP.OTA_END, u32(crc32(bytes)));
  }
}

function crc32(b) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) { c ^= b[i]; for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1)); }
  return (~c) >>> 0;
}

/* Simulated Bluetooth: requests go straight into the firmware's proto_handle() in WebAssembly. */
class SimTransport {
  constructor(X) { this.X = X; this.connected = true; }
  async send(bytes) {
    const X = this.X, mem = () => new Uint8Array(X.memory.buffer);
    if (!X.sim_ble_allowed()) throw new DcpOffline('Lost the dive computer: its Bluetooth is off, or a dive has started (Bluetooth only works on the surface).');
    mem().set(bytes, X.sim_io_req());
    const n = X.sim_proto(bytes.length);
    await new Promise(r => setTimeout(r, 4));   // a little link latency
    return mem().slice(X.sim_io_resp(), X.sim_io_resp() + n);
  }
}

/* Real Bluetooth LE through Web Bluetooth (Chrome on Android, Windows, macOS; not iOS Safari). */
class BleTransport {
  static available() { return typeof navigator !== 'undefined' && !!navigator.bluetooth; }
  async connect(onDisconnect) {
    this.device = await navigator.bluetooth.requestDevice({ filters: [{ services: [DC_SVC] }] });
    this.device.addEventListener('gattserverdisconnected', () => { this.connected = false; if (onDisconnect) onDisconnect(); });
    const server = await this.device.gatt.connect();
    const svc = await server.getPrimaryService(DC_SVC);
    this.rx = await svc.getCharacteristic(DC_RX);
    this.tx = await svc.getCharacteristic(DC_TX);
    this.buf = new Uint8Array(0);
    this.tx.addEventListener('characteristicvaluechanged', e => {
      const v = new Uint8Array(e.target.value.buffer), n = new Uint8Array(this.buf.length + v.length);
      n.set(this.buf); n.set(v, this.buf.length); this.buf = n;
      if (this.buf.length >= 5 && this.buf.length >= 5 + (this.buf[3] | (this.buf[4] << 8)) && this.done) this.done();
    });
    await this.tx.startNotifications();
    this.connected = true;
    return this.device.name || 'Dive computer';
  }
  disconnect() { if (this.device && this.device.gatt.connected) this.device.gatt.disconnect(); }
  async send(bytes) {
    this.buf = new Uint8Array(0);
    const reply = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new DcpOffline('No answer from the dive computer.')), 5000);
      this.done = () => { clearTimeout(timer); this.done = null; resolve(this.buf); };
    });
    for (let off = 0; off < bytes.length; off += 180) await this.rx.writeValueWithResponse(bytes.slice(off, off + 180));
    return reply;
  }
}

/* Settings blob <-> plain object, using the firmware's own settings code in WebAssembly. */
const SETTING_FIELDS = { gfLow: 10, gfHigh: 11, water: 12, lastStop: 13, ppo2Bottom: 14, ppo2Deco: 15, reserve: 16,
  ascentAlarm: 17, brightness: 18, pairing: 19, declination: 20, safetyStop: 21, bluetooth: 22, depthAlarm: 23,
  timeAlarm: 24, ndlWarn: 25, turnMargin: 26, flip: 27, logInterval: 28 };
function settingsFromBlob(X, blob) {
  new Uint8Array(X.memory.buffer).set(blob, X.app_blob());
  if (!X.app_st_load(blob.length)) throw new DcpError('Settings from the dive computer failed their checksum.');
  const s = { gases: [] };
  for (let i = 0; i < 5; i++)
    s.gases.push({ o2: X.app_st_get(0, i), he: X.app_st_get(1, i), on: X.app_st_get(2, i), cyl: X.app_st_get(3, i), fill: X.app_st_get(4, i), serial: X.app_st_get(5, i) >>> 0 });
  for (const [k, code] of Object.entries(SETTING_FIELDS)) s[k] = X.app_st_get(code, 0);
  return s;
}
function settingsToBlob(X, s) {
  s.gases.forEach((g, i) => { X.app_st_set(0, i, g.o2); X.app_st_set(1, i, g.he); X.app_st_set(2, i, g.on); X.app_st_set(3, i, g.cyl); X.app_st_set(4, i, g.fill); X.app_st_set(5, i, g.serial); });
  for (const [k, code] of Object.entries(SETTING_FIELDS)) X.app_st_set(code, 0, s[k]);
  const n = X.app_st_save();
  return new Uint8Array(X.memory.buffer).slice(X.app_blob(), X.app_blob() + n);
}
/* Gear list blob <-> plain object, using the firmware's gear code in WebAssembly.
 * { items: [{ type, onDive, size, work, serial, name }], gasCyl: [item index or -1 per gas], synced } */
const GEAR_TYPES = ['', 'Cylinder', 'Regulator', 'BCD', 'Suit', 'Weights', 'Light', 'Camera', 'Other'];
const GEAR_SIZE = { 1: ['L', 0.5, 30], 4: ['mm', 0.5, 10], 5: ['kg', 0.5, 30] };   /* types with a size: unit, step, max */
function gearFromBlob(X, blob) {
  new Uint8Array(X.memory.buffer).set(blob, X.app_gear_blob());
  const n = X.app_gear_load(blob.length);
  if (n < 0) throw new DcpError('The gear list from the dive computer failed its checksum.');
  return gearRead(X);
}
function gearRead(X) {
  const g = { items: [], gasCyl: [], synced: X.app_gear_synced() };
  for (let i = 0; i < X.app_gear_n(); i++) {
    const p = X.app_gear_name(i), m = new Uint8Array(X.memory.buffer); let e = p; while (m[e]) e++;
    g.items.push({ type: X.app_gear_get(i, 0), onDive: (X.app_gear_get(i, 1) & 1) === 1, size: X.app_gear_get(i, 2) / 10,
      work: X.app_gear_get(i, 3), serial: X.app_gear_get(i, 4), name: new TextDecoder().decode(m.subarray(p, e)) });
  }
  for (let k = 0; k < 5; k++) g.gasCyl.push(X.app_gear_cyl(k) - 1);
  return g;
}
function gearToBlob(X, g) {
  X.app_gear_clear();
  const enc = new TextEncoder();
  g.items.slice(0, X.app_gear_max()).forEach(it => {
    const buf = new Uint8Array(X.memory.buffer, X.app_gear_namebuf(), 17); buf.fill(0);
    buf.set(enc.encode(it.name.replace(/[^\x20-\x7e]/g, '?')).slice(0, 16));
    X.app_gear_add(it.type, it.onDive ? 1 : 0, Math.round((it.size || 0) * 10), it.type === 1 ? it.work : 0, it.type === 1 ? it.serial >>> 0 : 0);
  });
  g.gasCyl.forEach((c, k) => X.app_gear_set_cyl(k, c >= 0 ? c + 1 : 0));
  const n = X.app_gear_save(Math.floor(Date.now() / 1000));
  return new Uint8Array(X.memory.buffer).slice(X.app_gear_blob(), X.app_gear_blob() + n);
}
const GEAR_KEY = 'dc-gear-library';
function gearLibraryLoad() { try { const s = localStorage.getItem(GEAR_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function gearLibrarySave(g) { try { localStorage.setItem(GEAR_KEY, JSON.stringify(g)); } catch (e) { /* storage unavailable: the computer still has it */ } }

function logsToUddf(X, logs) {
  const mem = new Uint8Array(X.memory.buffer), lens = new Int32Array(X.memory.buffer, X.app_log_lens(), 64);
  let off = 0;
  logs.forEach((l, i) => { mem.set(l, X.app_log_buf() + off); lens[i] = l.length; off += l.length; });
  const n = X.app_uddf(logs.length);
  if (n === -1) throw new DcpError('A downloaded log failed its checksum.');
  if (n < 0) throw new DcpError('Too much data for one export; export fewer dives.');
  return new TextDecoder().decode(new Uint8Array(X.memory.buffer, X.app_xml(), n));
}

/* Dive log bytes -> plain object (layout in divelog.h). Used for the share card. */
function parseDiveLog(X, b) {
  const v = new DataView(b.buffer, b.byteOffset, b.byteLength);
  if (b.length < 68 || b[0] !== 68 || b[1] !== 76 || b[2] !== 71) throw new DcpError('Not a dive log.');
  if (b[3] !== 2) throw new DcpError('This dive log is from a different firmware version. Update the app.');
  const SZ = 24, i24 = o => { const x = b[o] | b[o + 1] << 8 | b[o + 2] << 16; return x & 0x800000 ? x - 0x1000000 : x; };
  const h = { no: v.getUint16(4, true), start: v.getUint32(6, true), duration: v.getUint32(10, true), maxDepth: v.getUint16(14, true) / 100,
    minTemp: v.getInt16(16, true) / 10, interval: b[20] || 2, gfLow: b[21], gfHigh: b[22], n: v.getUint32(44, true), deco: b[48] === 1,
    cns: b[49], battStart: b[50], battEnd: b[51], gases: [],
    pos: b[59] ? { lat: i24(53) / 1e4, lon: i24(56) / 1e4 } : null };
  for (let i = 0; i < 5; i++) h.gases.push({ o2: b[24 + i], he: b[29 + i], on: b[34 + i] === 1, cyl: b[39 + i] });
  h.samples = [];
  for (let j = 0; j < h.n && 64 + (j + 1) * SZ <= b.length; j++) {
    const o = 64 + j * SZ, tanks = [];
    for (let k = 0; k < 5; k++) { const t = v.getUint16(o + 10 + 2 * k, true); tanks.push(t === 0xFFFF ? null : t / 10); }
    h.samples.push({ t: j * h.interval, depth: v.getUint16(o, true) / 100, temp: v.getInt16(o + 2, true) / 10, ceil: v.getUint16(o + 4, true) / 100, gas: b[o + 8], tanks,
      x: v.getInt16(o + 20, true) / 10, y: v.getInt16(o + 22, true) / 10 });
  }
  const base = 64 + h.n * SZ + 4;
  h.gear = [];
  if (b.length > base) { try { h.gear = gearFromBlob(X, b.slice(base)).items; } catch (e) { /* no gear block */ } }
  // derived numbers
  const s = h.samples, dt = h.interval;
  let sumD = 0, decoS = 0;
  s.forEach(x => { sumD += x.depth; if (x.ceil > 0) decoS += dt; });
  h.avgDepth = s.length ? sumD / s.length : 0;
  // time spent stopped on the way up (deco and safety stops): after leaving the bottom, samples that hardly move
  let leave = 0; s.forEach((x, j) => { if (x.depth >= 0.9 * h.maxDepth) leave = j; });
  let stopS = 0;
  for (let j = leave + 1; j < s.length; j++) if (s[j].depth > 1 && Math.abs(s[j].depth - s[j - 1].depth) < 0.15) stopS += dt;
  h.decoMin = Math.round(decoS / 60);
  h.stopMin = Math.round(stopS / 60);
  h.used = h.gases.map((g, k) => {
    const p = s.map(x => x.tanks[k]).filter(x => x !== null);
    return p.length ? { start: p[0], end: p[p.length - 1], bar: p[0] - p[p.length - 1] } : null;
  });
  // SAC on gas 1 while it was breathed: litres used / (ambient bar x minutes)
  let barMin = 0;
  s.forEach(x => { if (x.gas === 0) barMin += (1.013 + x.depth / 10) * dt / 60; });
  h.sac = h.used[0] && barMin > 0 ? h.gases[0].cyl * h.used[0].bar / barMin : null;
  h.switches = [];
  s.forEach((x, j) => { if (j && x.gas !== s[j - 1].gas) h.switches.push({ t: x.t, depth: x.depth, gas: x.gas }); });
  return h;
}

/* ---------- dive archive on the phone: one summary per dive, kept after the computer's card is wiped ---------- */
const ARCHIVE_KEY = 'dc-dive-archive', LASTPOS_KEY = 'dc-last-position';
function archiveLoad() { try { return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]'); } catch (e) { return []; } }
function archiveSave(a) { try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(a)); } catch (e) { /* storage unavailable: the archive lasts for this visit */ } }
function lastPosLoad() { try { return JSON.parse(localStorage.getItem(LASTPOS_KEY) || 'null'); } catch (e) { return null; } }
function lastPosSave(p) { try { localStorage.setItem(LASTPOS_KEY, JSON.stringify(p)); } catch (e) { /* ignore */ } }
/* Summary of a parsed log. pos: the computer's own fix, else the phone's (right after the dive, or from the pre-dive sync). */
function summarizeDive(h, phonePos) {
  const step = Math.max(1, Math.ceil(h.samples.length / 150)), track = [];
  h.samples.forEach((s, j) => { if (j % step === 0) track.push([Math.round(s.x), Math.round(s.y)]); });
  const used = h.used.reduce((a, u) => a + (u ? u.bar : 0), 0);
  return { key: h.start, no: h.no, start: h.start, duration: h.duration, maxDepth: h.maxDepth, avgDepth: +h.avgDepth.toFixed(1), minTemp: h.minTemp,
    sac: h.sac ? +h.sac.toFixed(1) : null, deco: h.deco, used: Math.round(used), battUsed: h.battStart !== 255 && h.battEnd !== 255 ? h.battStart - h.battEnd : null,
    pos: h.pos || phonePos || null, posFrom: h.pos ? 'computer' : phonePos ? 'phone' : null, track, site: '' };
}
function diveStats(a) {
  if (!a.length) return null;
  const by = (f, pick = Math.max) => a.reduce((b, d) => (b === null || pick(f(d), f(b)) === f(d) ? d : b), null);
  const months = [], now = new Date();
  for (let k = 11; k >= 0; k--) { const m = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - k, 1)); months.push({ y: m.getUTCFullYear(), m: m.getUTCMonth(), n: 0, min: 0 }); }
  a.forEach(d => { const t = new Date(d.start * 1000), e = months.find(x => x.y === t.getUTCFullYear() && x.m === t.getUTCMonth()); if (e) { e.n++; e.min += d.duration / 60; } });
  const withSac = a.filter(d => d.sac), sites = new Set(a.filter(d => d.site).map(d => d.site));
  return { count: a.length, totalS: a.reduce((s, d) => s + d.duration, 0), deepest: by(d => d.maxDepth), longest: by(d => d.duration),
    coldest: by(d => d.minTemp, Math.min), bestSac: withSac.length ? withSac.reduce((b, d) => (d.sac < b.sac ? d : b)) : null,
    decoDives: a.filter(d => d.deco).length, sites: sites.size, months, busiest: months.reduce((b, m) => (m.n > b.n ? m : b), months[0]) };
}

/* ---------- maps: OpenStreetMap tiles when the page may load them, a plain chart otherwise ---------- */
const MAP_TILE = (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
const mercX = (lon, z) => (lon + 180) / 360 * 256 * 2 ** z;
const mercY = (lat, z) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 256 * 2 ** z; };
function trackLatLon(pos, track) { const k = 111320; return track.map(([x, y]) => ({ lat: pos.lat + y / k, lon: pos.lon + x / (k * Math.cos(pos.lat * Math.PI / 180)) })); }
function loadTile(url) {
  return new Promise((res, rej) => { const im = new Image(); im.crossOrigin = 'anonymous'; const t = setTimeout(() => rej(new Error('timeout')), 4000);
    im.onload = () => { clearTimeout(t); res(im); }; im.onerror = () => { clearTimeout(t); rej(new Error('tile')); }; im.src = url; });
}
/*
 * Draws into (x, y, w, h). lines: [[{lat,lon}...]], pins: [{lat, lon, label, n}]. Returns true when map tiles were drawn.

    ['Water', `${h.minTemp.toFixed(0)} °C`], ['Gas used', used ? `${used.toFixed(0)} bar` : '—'], ['SAC', h.sac ? `${h.sac.toFixed(1)} L/min` : '—']];

  stats.forEach(([k, val], i) => {

  c.lineTo(X_(s.length ? s[s.length - 1].t : 0), Y_(0)); c.closePath(); c.fillStyle = fill; c.fill();
  c.beginPath(); c.moveTo(X_(0), Y_(0)); s.forEach(x => c.lineTo(X_(x.t), Y_(x.depth))); c.strokeStyle = '#5FD0C4'; c.lineWidth = 5; c.stroke();

      if (have.has(l.start)) continue;

        const h = parseDiveLog(this.o.X, await this.download(l));
        let phone = null;
        const last = lastPosLoad();
        if (!h.pos) {
          if (Math.abs(now - (h.start + h.duration)) < 3 * 3600) phone = await this.position();          /* just surfaced: we are at the site */
          if (!phone && last && h.start - last.t < 6 * 3600 && h.start >= last.t - 600) phone = { lat: last.lat, lon: last.lon };   /* where we synced before the dive */
        }
        arch.push(summarizeDive(h, phone)); added++;

    }
    if (added) { arch.sort((a, b) => a.start - b.start); archiveSave(arch); this.r.logmsg.textContent = `${added} new dive${added > 1 ? 's' : ''} saved on this phone.`; }

        this.r.uddf.innerHTML = '<textarea class="ph-xml" readonly aria-label="UDDF export"></textarea><button type="button" class="ph-btn" data-copy>Copy UDDF</button>';
        const ta = this.r.uddf.querySelector('textarea'); ta.value = xml;
        this.r.uddf.querySelector('[data-copy]').addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(xml); this.r.logmsg.textContent = 'Copied.'; } catch (e) { ta.select(); this.r.logmsg.textContent = 'Press Ctrl+C / Cmd+C to copy the selected text.'; }
        });
      }
    } catch (e) { this.r.logmsg.textContent = `Export failed: ${e.message}`; }
  }
  async download(l) {
    if (!this.downloaded.has(l.no)) this.downloaded.set(l.no, await this.client.readLog(l.idx, p => { this.r.logmsg.textContent = `Downloading dive ${l.no}: ${Math.round(p * 100)} %`; }));
    return this.downloaded.get(l.no);
  }
  async share(idx) {
    const l = this.logs.find(x => x.idx === idx);
    if (!l) return;
    try {
      const dive = parseDiveLog(this.o.X, await this.download(l));
      this.r.logmsg.textContent = '';
      const el = this.r.share;
      el.hidden = false;
      el.innerHTML = `<div class="ph-row"><label for="ph-site">Dive site</label><input id="ph-site" type="text" maxlength="40" placeholder="e.g. Gulosen, Trondheimsfjorden"></div>
        <canvas class="ph-card" aria-label="Share picture of dive ${dive.no}"></canvas>
        <div class="ph-row"><button type="button" class="ph-btn ph-primary" data-go>Share…</button>${this.o.canDownload ? '<button type="button" class="ph-btn" data-save>Save image</button>' : ''}
        <button type="button" class="ph-btn" data-close>Close</button></div><p class="ph-note" data-msg></p>`;
      const cv = el.querySelector('canvas'), site = el.querySelector('#ph-site'), msg = el.querySelector('[data-msg]');
      const entry = (this.archive || []).find(d => d.key === dive.start);
      site.value = (entry && entry.site) || siteLoad(dive.start);
      const redraw = () => drawShareCard(cv, dive, site.value.trim(), { tiles: this.o.tiles, pos: entry && entry.pos });
      redraw();
      site.addEventListener('input', () => { siteSave(dive.start, site.value.trim()); if (entry) { entry.site = site.value.trim(); archiveSave(this.archive); } redraw(); });
      site.addEventListener('change', () => { this.renderStats(); this.renderSites(); });
      const file = () => new Promise((res, rej) => cv.toBlob ? cv.toBlob(b => b ? res(new File([b], `dive-${dive.no}.png`, { type: 'image/png' })) : rej(new Error('no image')), 'image/png') : rej(new Error('no image')));
      el.querySelector('[data-close]').addEventListener('click', () => { el.hidden = true; el.innerHTML = ''; });
      el.querySelector('[data-go]').addEventListener('click', async () => {
        const noSheet = this.o.canDownload ? 'This browser cannot open the share sheet. Use Save image and post it from your gallery.' : 'In the app on a phone this opens the share sheet (Instagram, Strava, Messenger …). Here you can only preview it.';
        if (!navigator.canShare) { msg.textContent = noSheet; return; }
        try {
          const f = await file();
          if (navigator.canShare && navigator.canShare({ files: [f] })) {
            await navigator.share({ files: [f], title: `Dive #${dive.no}`, text: `${site.value.trim() || 'Dive'} · ${dive.maxDepth.toFixed(1)} m · ${Math.round(dive.duration / 60)} min` });
            msg.textContent = 'Shared.';
          } else msg.textContent = this.o.canDownload ? 'This browser cannot open the share sheet. Use Save image and post it from your gallery.' : 'In the app on a phone this opens the share sheet (Instagram, Strava, Messenger …). Here you can only preview it.';
        } catch (e) { if (e.name !== 'AbortError') msg.textContent = this.o.canDownload ? 'Could not share. Use Save image instead.' : 'In the app on a phone this opens the share sheet (Instagram, Strava, Messenger …). Here you can only preview it.'; }
      });
      const save = el.querySelector('[data-save]');
      if (save) save.addEventListener('click', async () => { const f = await file(); const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); });
      el.scrollIntoView && el.scrollIntoView({ block: 'nearest' });
    } catch (e) { this.r.logmsg.textContent = `Could not make the picture: ${e.message}`; }
  }
  async flash() {
    const file = this.r.fw.files && this.r.fw.files[0];
    if (!file) { this.r.fwmsg.textContent = 'Choose a firmware file (.bin) first.'; return; }
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      this.r.prog.hidden = false;
      await this.client.updateFirmware(bytes, p => { this.r.prog.value = p; this.r.fwmsg.textContent = `Sending ${Math.round(p * 100)} %`; });
      this.r.fwmsg.textContent = 'Installed. The dive computer restarts into the new firmware.';
      await this.loadInfo().catch(() => {});
    } catch (e) { this.r.fwmsg.textContent = `Update failed: ${e.message}`; }
  }
}

(async () => {
  const bytes = Uint8Array.from(atob(WASM_B64), c => c.charCodeAt(0));
  const { instance } = await WebAssembly.instantiate(bytes, {});
  const X = instance.exports; X._initialize();
  const style = document.createElement('style'); style.textContent = PHONE_CSS; document.head.appendChild(style);
  if (!BleTransport.available()) document.getElementById('nobt').hidden = false;
  const ui = new PhoneUI(document.getElementById('app'), {
    X, canDownload: true, tiles: true,
    getPosition: () => new Promise((res, rej) => navigator.geolocation
      ? navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), rej, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 })
      : rej(new Error('no GPS'))),
    connect: async onDrop => { const t = new BleTransport(); const name = await t.connect(onDrop); ui.o.title = `Connected to ${name}`; return t; }
  });
})();
