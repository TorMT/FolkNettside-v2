name: v2-pull-request-checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: find src tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        run: npm test
      - name: Validate interactive SiteUpdater and nested resource indexing
        run: python3 -m unittest discover -s tests -p 'test_update_site_interactive.py' -v
      - name: Block protected resources from public static preview
        run: |
          python3 -m unittest discover -s tests -p 'test_public_asset_audit.py' -v
          python3 scripts/audit_public_assets.py

      - name: Mobile navigation About CV Contact and overflow browser regression
        run: |
          command -v chromedriver
          python3 -m http.server 4210 --bind 127.0.0.1 >/tmp/mobile-cv-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/mobile-cv-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4210/tests/browser/mobile-cv-nav-smoke.html 35 1280,900

      - name: Mobile engineering and tools route matrix
        run: |
          command -v chromedriver
          python3 -m http.server 4211 --bind 127.0.0.1 >/tmp/mobile-eng-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/mobile-eng-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4211/tests/browser/mobile-engineering-tools-smoke.html 90 1280,900

      - name: Static encrypted resources and offline unlock browser smoke
        run: |
          command -v chromedriver
          python3 -m http.server 4214 --bind 127.0.0.1 >/tmp/vault-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/vault-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4214/tests/browser/static-vault-smoke.html 50 1280,900

      - name: Structure FEM interactive 3D beam orbit and pan browser smoke
        run: |
          command -v chromedriver
          python3 -m http.server 4213 --bind 127.0.0.1 >/tmp/frame-orbit-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/frame-orbit-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4213/tests/browser/structure-beam-orbit-smoke.html 40 1280,900

      - name: Sectional Area Curve numerical and browser rendering check
        run: |
          command -v chromedriver
          python3 -m http.server 4212 --bind 127.0.0.1 >/tmp/sac-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/sac-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4212/tests/browser/sac-curve-smoke.html 30

      - name: Verify all CoolProp native/reference tables with real WASM
        run: |
          python3 scripts/fetch_coolprop_wasm.py
          node scripts/verify_coolprop_reference.mjs

      - name: Courses sidebar scroll and highlight browser regression
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python3 -m http.server 4209 --bind 127.0.0.1 >/tmp/course-nav-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time,urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4209/tests/browser/course-scrollspy-smoke.html',timeout=1)
                  break
              except Exception:time.sleep(.1)
          else: raise SystemExit('Course test server did not start')
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1280,800 --virtual-time-budget=7500 \
            --dump-dom http://127.0.0.1:4209/tests/browser/course-scrollspy-smoke.html >/tmp/course-nav-dom.html
          grep -q 'data-status="pass"' /tmp/course-nav-dom.html || {
            grep -E 'data-status=|<pre class="test-result"' /tmp/course-nav-dom.html || true
            exit 1
          }

      - name: Quiz chapter and Excel formula browser regression
        run: |
          command -v chromedriver
          python3 -m http.server 4207 --bind 127.0.0.1 >/tmp/quiz-formulas-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/quiz-formulas-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4207/tests/browser/quiz-formula-smoke.html 35 1440,900

      - name: KISSsoft upload and visualization browser smoke
        run: |
          command -v chromedriver
          python3 -m http.server 4208 --bind 127.0.0.1 >/tmp/kisssoft-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/kisssoft-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4208/tests/browser/kisssoft-smoke.html 30

      - name: MedisinTimer browser smoke
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python3 -m http.server 4190 --bind 127.0.0.1 >/tmp/medisin-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4190/tests/browser/medisin-v2-smoke.html',timeout=1)
                  break
              except Exception: time.sleep(.1)
          else: raise SystemExit('Medisin browser test server did not start')
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 \
            --dump-dom http://127.0.0.1:4190/tests/browser/medisin-v2-smoke.html \
            >/tmp/medisin-v2-smoke-dom.html
          grep -q 'data-status="pass"' /tmp/medisin-v2-smoke-dom.html || {
            cat /tmp/medisin-v2-smoke-dom.html
            exit 1
          }

      - name: Native LAOS and student sites browser smoke
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python3 -m http.server 4191 --bind 127.0.0.1 >/tmp/catalogs-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4191/tests/browser/study-catalogs-smoke.html',timeout=1)
                  break
              except Exception: time.sleep(.1)
          else: raise SystemExit('Catalog smoke server did not start')
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 \
            --dump-dom http://127.0.0.1:4191/tests/browser/study-catalogs-smoke.html \
            >/tmp/catalogs-smoke-dom.html
          grep -q 'data-status="pass"' /tmp/catalogs-smoke-dom.html || {
            cat /tmp/catalogs-smoke-dom.html
            exit 1
          }

      - name: Hydro worker geometry gate browser smoke
        run: |
          command -v chromedriver
          python3 -m http.server 4192 --bind 127.0.0.1 >/tmp/hydro-validation-browser.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/hydro-chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4192/tests/browser/hydro-preflight-smoke.html

      - name: Generic STL Hydro import Chrome end-to-end
        run: |
          command -v chromedriver
          python3 -m http.server 4193 --bind 127.0.0.1 >/tmp/generic-hydro-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9516 --allowed-ips=127.0.0.1 >/tmp/generic-hydro-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_generic_hydro_browser.py 'http://127.0.0.1:4193/#/engineering/hydro'

      - name: Hydro moonpool waterplane worker browser smoke
        run: |
          command -v chromedriver
          python3 -m http.server 4195 --bind 127.0.0.1 >/tmp/hydro-moonpool-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/hydro-moonpool-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4195/tests/browser/hydro-waterplane-smoke.html

      - name: Semester rail hides scrollbar on mobile and desktop
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python3 -m http.server 4186 --bind 127.0.0.1 >/tmp/semester-layout-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time,urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4186/tests/browser/semester-mobile-smoke.html',timeout=1).read(20)
                  break
              except Exception:time.sleep(.1)
          else:raise SystemExit('Semester layout browser server failed')
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=5000 \
            --dump-dom http://127.0.0.1:4186/tests/browser/semester-mobile-smoke.html >/tmp/semester-layout-mobile.html
          grep -q 'data-status="pass"' /tmp/semester-layout-mobile.html || { cat /tmp/semester-layout-mobile.html; exit 1; }
          "$browser" --headless=new --no-sandbox --disable-gpu --window-size=900,844 --virtual-time-budget=5000 \
            --dump-dom 'http://127.0.0.1:4186/tests/browser/semester-mobile-smoke.html?desktop=1' >/tmp/semester-layout-desktop.html
          grep -q 'data-status="pass"' /tmp/semester-layout-desktop.html || { cat /tmp/semester-layout-desktop.html; exit 1; }
          grep '<pre id="result">' /tmp/semester-layout-mobile.html /tmp/semester-layout-desktop.html

      - name: Complete Hydro block numerical and worker browser check
        run: |
          command -v chromedriver
          python3 -m http.server 4197 --bind 127.0.0.1 >/tmp/hydro-complete-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/hydro-complete-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4197/tests/browser/hydro-block-complete-smoke.html

      - name: Dive map icon and filter browser interaction check
        run: |
          command -v chromedriver
          python3 -m http.server 4196 --bind 127.0.0.1 >/tmp/dive-icon-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/dive-icon-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4196/tests/browser/diverse-dive-smoke.html

      - name: Engineering scroll and resize browser regression
        run: |
          command -v chromedriver
          python3 -m http.server 4198 --bind 127.0.0.1 >/tmp/engineering-scroll-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/engineering-scroll-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4198/tests/browser/engineering-layout-smoke.html 30 1440,900

      - name: Python and notebook editable viewer browser regression
        run: |
          command -v chromedriver
          python3 -m http.server 4199 --bind 127.0.0.1 >/tmp/python-viewers-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/python-viewers-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4199/tests/browser/python-viewers-smoke.html

      - name: Real Python/Pyodide Worker execution browser regression
        run: |
          command -v chromedriver
          python3 -m http.server 4200 --bind 127.0.0.1 >/tmp/python-live-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/python-live-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4200/tests/browser/python-live-runtime-smoke.html 180

      - name: Actual 3D waterline and wave data browser regression
        run: |
          command -v chromedriver
          python3 -m http.server 4201 --bind 127.0.0.1 >/tmp/model-waves-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/model-waves-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4201/tests/browser/model-waves-smoke.html 70 1400,900

      - name: Complete ViewerShell file-format matrix in real Chrome
        run: |
          command -v chromedriver
          python3 -m http.server 4202 --bind 127.0.0.1 >/tmp/viewer-matrix-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/viewer-matrix-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4202/tests/browser/viewer-matrix-smoke.html 90 1400,900

      - name: Browser test image audio ZIP CAD and OBJ viewers
        run: |
          command -v chromedriver
          python3 -m http.server 4204 --bind 127.0.0.1 >/tmp/viewer-coverage-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/viewer-coverage-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4204/tests/browser/viewer-format-coverage-smoke.html 90 1400,900

      - name: Loaded hull FEM contours and field visualization in real Chrome
        run: |
          command -v chromedriver
          python3 -m http.server 4207 --bind 127.0.0.1 >/tmp/hull-fem-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/hull-fem-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4207/tests/browser/hull-girder-3d-smoke.html 50 1440,900
