name: v2-pull-request-checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: find src tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        run: npm test
      - name: Verify NTNU same-origin code-only publishing
        run: |
          python3 -m unittest discover -s tests -p 'test_publish_ntnu_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_ntnu_release.py' -v
          python3 -m py_compile scripts/ntnu_release.py
          python3 -m unittest discover -s tests -p 'test_verify_ntnu_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_ntnu_autocatalog.py' -v
          python3 -m unittest discover -s tests -p 'test_publish_ntnu_autocatalog.py' -v
          python3 -m py_compile scripts/verify_ntnu_staging.py
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("Oppdater-FolkNettside.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if($errors.Count -gt 0){ $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          temp="$(mktemp -d)"
          python3 scripts/build_ntnu_staging.py --version "$GITHUB_SHA" --output "$temp/v2-staging"
          test -f "$temp/v2-staging/index.html"
          test -f "$temp/v2-staging/src/courses/ntnu-catalog.js"
          test ! -d "$temp/v2-staging/semestre"
          test ! -d "$temp/v2-staging/.git"
      - name: ChromeDriver readiness startup regression
        run: python3 -m unittest discover -s tests -p 'test_browser_driver_startup.py' -v

      - name: VS Code style Python and Jupyter viewer on desktop and mobile
        run: |
          command -v chromedriver
          python3 -m http.server 4217 --bind 127.0.0.1 >/tmp/python-vscode-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/python-vscode-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4217/tests/browser/vscode-code-viewer-smoke.html 50 1280,900
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4217/tests/browser/vscode-code-viewer-smoke.html 50 390,844

      - name: Validate interactive SiteUpdater and nested resource indexing
        run: python3 -m unittest discover -s tests -p 'test_update_site_interactive.py' -v
      - name: Block protected resources from public static preview
        run: |
          python3 -m unittest discover -s tests -p 'test_public_asset_audit.py' -v
          python3 scripts/audit_public_assets.py

      - name: Courses new-file notices and XSS-safe routes browser regression
        run: |
          command -v chromedriver
          python3 -m http.server 4227 --bind 127.0.0.1 >/tmp/course-updates-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/course-updates-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4227/tests/browser/course-updates-smoke.html 35 1440,900

      - name: Mobile navigation About CV Contact and overflow browser regression
        run: |
          command -v chromedriver
          python3 -m http.server 4210 --bind 127.0.0.1 >/tmp/mobile-cv-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/mobile-cv-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4210/tests/browser/mobile-cv-nav-smoke.html 35 1280,900

      - name: Mobile engineering and tools route matrix
        run: |
          command -v chromedriver
          python3 -m http.server 4211 --bind 127.0.0.1 >/tmp/mobile-eng-http.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/mobile-eng-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4211/tests/browser/mobile-engineering-tools-smoke.html 90 1280,900

      - name: Structure workspace 3D beam and 2D switch integration smoke
        run: |
          command -v chromedriver
          python3 -m http.server 4215 --bind 127.0.0.1 >/tmp/structure-route-http.log 2>&1 &
