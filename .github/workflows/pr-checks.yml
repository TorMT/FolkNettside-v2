          import time,urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4209/tests/browser/course-scrollspy-smoke.html',timeout=1)
                  break
              except Exception:time.sleep(.1)
          else: raise SystemExit('Course test server did not start')
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1280,800 --virtual-time-budget=7500 \
            --dump-dom http://127.0.0.1:4209/tests/browser/course-scrollspy-smoke.html >/tmp/course-nav-dom.html
          grep -q 'data-status="pass"' /tmp/course-nav-dom.html || {
            grep -E 'data-status=|<pre class="test-result"' /tmp/course-nav-dom.html || true
            exit 1
          }

