          # headless Chrome virtual timer. Use real-time WebDriver polling.
          python3 scripts/test_hydro_worker_browser.py http://127.0.0.1:4190/tests/browser/medisin-v2-smoke.html 55 1440,900

      - name: Native LAOS and student sites browser smoke
