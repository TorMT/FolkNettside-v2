name: deploy-pages-preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: folk-v2-pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build content manifest
        run: |
          python scripts/update_site.py
          python scripts/update_site.py --check
      - name: JavaScript syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: npm test
      - name: Smoke check
        run: |
          test -f index.html
          test -f src/app.js
          test -f src/content.js
          test -f data/content-manifest.json
          test -f examples/semesters/5/TMR4182/Kok/hydro-demo.py
      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,docs,scripts'
