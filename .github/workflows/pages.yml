name: deploy-pages-preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: folk-v2-pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build content manifest
        run: |
          python scripts/update_site.py
          python scripts/update_site.py --check
      - name: Validate content and project data
        run: python scripts/validate_content.py
      - name: JavaScript syntax check
        run: find src tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: npm test
      - name: Smoke check
        run: |
          test -f index.html
          test -f src/app.js
          test -f src/content.js
          test -f data/content-manifest.json
          test -f examples/semesters/5/TMR4182/Kok/hydro-demo.py
      - name: Fetch and verify CoolProp WASM
        run: |
          python scripts/fetch_coolprop_wasm.py
          test -f src/vendor/coolprop/coolprop.wasm
          python - <<'PY'
          from pathlib import Path
          data=Path("src/vendor/coolprop/coolprop.wasm").read_bytes()
          assert data[:4] == b"\x00asm"
          print("CoolProp WASM compile input verified:", len(data), "bytes")
          PY
      - name: Build cache-busted Pages tree
        run: |
          python scripts/build_preview.py --version "${GITHUB_SHA}"
          grep -q "app.js?v=${GITHUB_SHA}" .deploy/index.html
          test -f .deploy/build.txt
      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.deploy
          publish_branch: gh-pages
