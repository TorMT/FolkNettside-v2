name: deploy-pages-preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: folk-v2-pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build content manifest
        run: |
          python scripts/update_site.py
          python scripts/update_site.py --check
      - name: Validate content and project data
        run: python scripts/validate_content.py
      - name: Deny private or credential-like files in public assets
        run: |
          python scripts/audit_public_assets.py
          python -m unittest discover -s tests -p 'test_public_asset_audit.py' -v
      - name: JavaScript syntax check
        run: find src tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: npm test
      - name: Theme Studio image mode browser smoke
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/theme-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4173/tests/browser/theme-image-smoke.html", timeout=1).read(32)
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit("Theme browser smoke server did not start")
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 \
            --dump-dom http://127.0.0.1:4173/tests/browser/theme-image-smoke.html \
            >/tmp/theme-image-smoke-dom.html
          grep -q 'data-status="pass"' /tmp/theme-image-smoke-dom.html || {
            cat /tmp/theme-image-smoke-dom.html
            exit 1
          }
          grep '<pre id="result">' /tmp/theme-image-smoke-dom.html || true
      - name: Gunnerus GLB browser smoke
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python - <<'PY'
          import json, pathlib, time, urllib.request
          config=json.loads(pathlib.Path("data/gunnerus-model.json").read_text())
          target=pathlib.Path("tests/browser/fixtures/gunnerus")
          target.mkdir(parents=True,exist_ok=True)
          for key,name in [("sourcePath","gunnerus.glb"),("partMetadataPath","gunnerus-parts.json")]:
              last=None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(config[key],timeout=30) as response:
                          (target/name).write_bytes(response.read())
                      break
                  except Exception as error:
                      last=error
                      time.sleep(1+attempt)
              else:
                  raise SystemExit(f"Could not cache {key}: {last}")
          PY
          python -m http.server 4174 --bind 127.0.0.1 >/tmp/gunnerus-browser-server.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/gunnerus-chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4174/tests/browser/gunnerus-glb-smoke.html?local=1", timeout=1).read(32)
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit("Gunnerus browser smoke server did not start")
          PY
          python3 scripts/test_hydro_worker_browser.py \
            'http://127.0.0.1:4174/tests/browser/gunnerus-glb-smoke.html?local=1'
      - name: Study workspace browser smoke
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python -m http.server 4175 --bind 127.0.0.1 >/tmp/study-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4175/tests/browser/study-workspace-smoke.html", timeout=1).read(32)
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit("Study browser smoke server did not start")
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 \
            --dump-dom http://127.0.0.1:4175/tests/browser/study-workspace-smoke.html \
            >/tmp/study-workspace-smoke-dom.html
          grep -q 'data-status="pass"' /tmp/study-workspace-smoke-dom.html || {
            cat /tmp/study-workspace-smoke-dom.html
            exit 1
          }
          grep '<pre id="result">' /tmp/study-workspace-smoke-dom.html || true
      - name: Mobile semester rail browser smoke
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python -m http.server 4180 --bind 127.0.0.1 >/tmp/semester-mobile-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4180/tests/browser/semester-mobile-smoke.html", timeout=1).read(32)
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit("Semester mobile smoke server did not start")
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=5000 \
            --dump-dom http://127.0.0.1:4180/tests/browser/semester-mobile-smoke.html \
            >/tmp/semester-mobile-smoke-dom.html
          grep -q 'data-status="pass"' /tmp/semester-mobile-smoke-dom.html || {
            cat /tmp/semester-mobile-smoke-dom.html
            exit 1
          }
          grep '<pre id="result">' /tmp/semester-mobile-smoke-dom.html || true
      - name: Diverse dive browser smoke
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python -m http.server 4181 --bind 127.0.0.1 >/tmp/diverse-dive-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4181/tests/browser/diverse-dive-smoke.html", timeout=1).read(32)
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit("Diverse dive smoke server did not start")
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --window-size=1400,900 --virtual-time-budget=7000 \
            --dump-dom http://127.0.0.1:4181/tests/browser/diverse-dive-smoke.html \
            >/tmp/diverse-dive-smoke-dom.html
          grep -q 'data-status="pass"' /tmp/diverse-dive-smoke-dom.html || {
            cat /tmp/diverse-dive-smoke-dom.html
            exit 1
          }
          grep '<pre id="result">' /tmp/diverse-dive-smoke-dom.html || true
      - name: Brewing v2 browser smoke
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python -m http.server 4182 --bind 127.0.0.1 >/tmp/brewing-v2-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4182/tests/browser/brewing-v2-smoke.html", timeout=1).read(32)
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit("Brewing v2 smoke server did not start")
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --window-size=1400,900 --virtual-time-budget=8000 \
            --dump-dom http://127.0.0.1:4182/tests/browser/brewing-v2-smoke.html \
            >/tmp/brewing-v2-smoke-dom.html
          grep -q 'data-status="pass"' /tmp/brewing-v2-smoke-dom.html || {
            cat /tmp/brewing-v2-smoke-dom.html
            exit 1
          }
          grep '<pre id="result">' /tmp/brewing-v2-smoke-dom.html || true
      - name: Settings app browser smoke
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python -m http.server 4177 --bind 127.0.0.1 >/tmp/settings-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4177/tests/browser/settings-app-smoke.html", timeout=1).read(32)
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit("Settings browser smoke server did not start")
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=20000 \
            --dump-dom http://127.0.0.1:4177/tests/browser/settings-app-smoke.html \
            >/tmp/settings-app-smoke-dom.html
          grep -q 'data-status="pass"' /tmp/settings-app-smoke-dom.html || {
            cat /tmp/settings-app-smoke-dom.html
            exit 1
          }
          grep '<pre id="result">' /tmp/settings-app-smoke-dom.html || true
      - name: Viewer adapter browser matrix
        run: |
          command -v chromedriver
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/viewer-browser-server.log 2>&1 &
          server_pid=$!
          chromedriver --port=9515 --allowed-ips=127.0.0.1 >/tmp/viewer-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          python3 scripts/test_hydro_worker_browser.py \
            http://127.0.0.1:4176/tests/browser/viewer-matrix-smoke.html 90 1280,900
      - name: CoolProp diagram browser smoke
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python -m http.server 4183 --bind 127.0.0.1 >/tmp/coolprop-diagram-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4183/tests/browser/coolprop-diagram-smoke.html",timeout=1).read(32)
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit("CoolProp diagram smoke server did not start")
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --window-size=1100,700 --virtual-time-budget=10000 \
            --dump-dom http://127.0.0.1:4183/tests/browser/coolprop-diagram-smoke.html \
            >/tmp/coolprop-diagram-smoke-dom.html
          grep -q 'data-status="pass"' /tmp/coolprop-diagram-smoke-dom.html || {
            cat /tmp/coolprop-diagram-smoke-dom.html
            exit 1
          }
          grep '<pre id="result">' /tmp/coolprop-diagram-smoke-dom.html || true
      - name: Engineering layout browser smoke
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python -m http.server 4177 --bind 127.0.0.1 >/tmp/engineering-layout-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4177/tests/browser/engineering-layout-smoke.html", timeout=1).read(32)
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit("Engineering layout smoke server did not start")
          PY
          "$browser" --headless=new --no-sandbox --disable-gpu --window-size=1400,900 --virtual-time-budget=5000             --dump-dom http://127.0.0.1:4177/tests/browser/engineering-layout-smoke.html             >/tmp/engineering-layout-smoke-dom.html
          grep -q 'data-status="pass"' /tmp/engineering-layout-smoke-dom.html || {
            cat /tmp/engineering-layout-smoke-dom.html
            exit 1
          }
          grep '<pre id="result">' /tmp/engineering-layout-smoke-dom.html || true
      - name: Hydro performance benchmark
        run: npm run benchmark:hydro
      - name: Smoke check
        run: |
          test -f index.html
          test -f src/app.js
          test -f src/content.js
          test -f data/content-manifest.json
          test -f examples/semesters/5/TMR4182/Kok/hydro-demo.py
      - name: Verify vendored CoolProp WASM (offline)
        run: |
          python scripts/fetch_coolprop_wasm.py
          test -f src/vendor/coolprop/coolprop.wasm
          python - <<'PY'
          from pathlib import Path
          data=Path("src/vendor/coolprop/coolprop.wasm").read_bytes()
          assert data[:4] == b"\x00asm"
          print("CoolProp WASM compile input verified:", len(data), "bytes")
          PY
      - name: Verify CoolProp numerical references
        run: node scripts/verify_coolprop_reference.mjs
      - name: Test Pages build integrity
        run: python -m unittest discover -s tests -p "test_build_preview.py" -v
      - name: Build cache-busted Pages tree
        run: |
          python scripts/build_preview.py --version "${GITHUB_SHA}"
          grep -q "app.js?v=${GITHUB_SHA}" .deploy/index.html
          test -f .deploy/build.txt
      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.deploy
          publish_branch: gh-pages
