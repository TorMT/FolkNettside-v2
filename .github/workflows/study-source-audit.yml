name: study-source-audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-laos-public:
    if: github.head_ref == 'feature/import-verified-kok-source'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public LAOS HTML and script source references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          import re
          url='https://tormt.folk.ntnu.no/diverse/LAOS/'
          data=urlopen(Request(url,headers={'User-Agent':'FolkNettside-v2-readonly-migration-audit/1.0'}),timeout=22).read()
          text=data.decode('utf-8','replace')
          print('MAIN HTML length',len(data),'URL',url)
          class P(HTMLParser):
              def __init__(self):super().__init__();self.scripts=[];self.inline=[];self.active=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='script':
                      if a.get('src'):self.scripts.append(urljoin(url,a['src']))
                      else:self.active=True
              def handle_endtag(self,tag):
                  if tag=='script':self.active=False
              def handle_data(self,txt):
                  if self.active:self.inline.append(txt)
          p=P();p.feed(text)
          print('SCRIPT REFERENCES:',p.scripts)
          for script in p.scripts[:12]:
              try:
                  s=urlopen(Request(script,headers={'User-Agent':'FolkNettside-v2-readonly-migration-audit/1.0'}),timeout=15).read(250000).decode('utf-8','replace')
                  print('SCRIPT:',script,'length:',len(s))
                  for term in ['fetch(','.json','api/','list.php','files.php','øving','oving','LAOS','file-list']:
                      for m in list(re.finditer(re.escape(term),s,re.I))[:7]:
                          print('  MATCH',term,'context=',repr(s[max(0,m.start()-110):m.end()+210]))
              except Exception as e:print('  SCRIPT ERROR',str(e)[:200])
          for inline in p.inline[:15]:
              print('INLINE:',inline[:4000])
          print('END PUBLIC INSPECTION')
          PY

      - name: Inspect LAOS authoritative JSON and PDF links
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, hashlib
          base="https://tormt.folk.ntnu.no/diverse/LAOS/filer/"
          with urllib.request.urlopen(base+"index.json",timeout=25) as r:
              raw=r.read()
          print("INDEX:",raw.decode("utf-8","replace"))
          data=json.loads(raw.decode("utf-8-sig"))
          files=[filename for k,v in data.items() if isinstance(v,dict) and not v.get("beskyttet") for filename in v.get("files",[])]
          print("LAOS file names:",repr(files))
          for f in files:
              url=base+urllib.parse.quote(f,safe="/")
              try:
                  with urllib.request.urlopen(url,timeout=25) as resp:
                      head=resp.read(16)
                      print("FILE:",repr(f),"url=",url,"status=",resp.status,"content_type=",resp.headers.get("Content-Type"),"size=",resp.headers.get("Content-Length"),"magic=",head.hex())
              except Exception as e:print("FILE FAILURE",repr(f),type(e).__name__,str(e)[:250])
          PY


      - name: Inspect original AndreKokSider source links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request,urlopen
          import re
          url="https://tormt.folk.ntnu.no/diverse/AndreKokSider/"
          with urlopen(Request(url,headers={'User-Agent':'FolkNettside-v2-read-only-migration/1.0'}),timeout=25) as resp:
              html=resp.read(200000).decode("utf-8","replace")
          print('ANDREKOK HTML LENGTH:',len(html))
          print('ANDREKOK HTML SAMPLE:',repr(html[:13000]))
          class Scripts(HTMLParser):
              def __init__(self):super().__init__();self.srcs=[];self.isinline=False;self.inline=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      source=dict(attrs).get('src')
                      if source:self.srcs.append(urljoin(url,source))
                      else:self.isinline=True
              def handle_endtag(self,tag):
                  if tag=='script':self.isinline=False
              def handle_data(self,text):
                  if self.isinline:self.inline.append(text)
          p=Scripts();p.feed(html)
          print("ANDREKOK SCRIPTS:",p.srcs)
          for code in p.inline:
              if any(t in code.lower() for t in ('fetch(','.json','koksider','script.js','pages')):
                  print('ANDREKOK INLINE SOURCE:',repr(code[:4000]))
          for source in p.srcs:
              if not source.startswith('https://tormt.folk.ntnu.no/diverse/AndreKokSider/'):
                  continue
              try:
                  with urlopen(Request(source,headers={'User-Agent':'FolkNettside-v2-read-only-migration/1.0'}),timeout=25) as resp:
                      script=resp.read(300000).decode('utf-8','replace')
                  print('ANDREKOK SCRIPT:',source,'length:',len(script))
                  for term in ['fetch(','.json','const sites','const pages','filter','rating','student','studier']:
                      for m in list(re.finditer(re.escape(term),script,re.I))[:8]:
                          print(' MATCH',term,repr(script[max(0,m.start()-110):m.end()+230]))
              except Exception as e:print('SCRIPT ERROR',source,type(e).__name__,str(e)[:200])
          PY
  import-verified-laos-pdfs:
    if: github.head_ref == 'feature/import-verified-kok-source' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Import the publicly indexed LAOS PDF files
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib, urllib.request, urllib.parse, datetime
          base='https://tormt.folk.ntnu.no/diverse/LAOS/filer/'
          headers={'User-Agent':'FolkNettside-v2-read-only-laos-import/1.0'}
          with urllib.request.urlopen(urllib.request.Request(base+'index.json',headers=headers),timeout=30) as r:
              index=json.loads(r.read().decode('utf-8-sig'))
          entries=[]
          target=pathlib.Path('data/diverse/laos-files')
          target.mkdir(parents=True,exist_ok=True)
          for group,info in index.items():
              if not isinstance(info,dict) or info.get('beskyttet'):
                  continue
              for name in info.get('files',[]):
                  if not isinstance(name,str) or name != pathlib.Path(name).name or not name.lower().endswith('.pdf'):
                      raise RuntimeError('Unexpected indexed filename: '+repr(name))
                  url=base+urllib.parse.quote(name,safe='')
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40) as r:
                      content=r.read(10_000_001)
                      content_type=r.headers.get('Content-Type','')
                  if len(content)>10_000_000 or not content.startswith(b'%PDF-'):
                      raise RuntimeError('Not a small valid PDF: '+url+' '+content_type)
                  (target/name).write_bytes(content)
                  digest=hashlib.sha256(content).hexdigest()
                  print('COPIED',name,len(content),'sha256',digest,'from',url)
                  entries.append({
                      'title':name.removesuffix('.pdf').replace('_',' '),
                      'url':'./data/diverse/laos-files/'+urllib.parse.quote(name,safe=''),
                      'courseCode':'',
                      'semester':'',
                      'category':'LAOS / '+group,
                      'source':url,
                      'sha256':digest
                  })
          if not entries:
              raise RuntimeError('LAOS file index has no public PDF records, stopping instead of creating an empty copy')
          welcome=index.get('welcome')
          welcome_meta={}
          if isinstance(welcome,str) and welcome==pathlib.Path(welcome).name and welcome.lower().endswith(('.jpg','.jpeg','.png')):
              image_url=base+urllib.parse.quote(welcome,safe='')
              try:
                  with urllib.request.urlopen(urllib.request.Request(image_url,headers=headers),timeout=30) as image_resp:
                      image_data=image_resp.read(10_000_001)
                  jpeg=image_data.startswith(bytes.fromhex('ffd8ff'))
                  png=image_data.startswith(bytes.fromhex('89504e470d0a1a0a'))
                  if len(image_data)<=10_000_000 and (jpeg or png):
                      (target/welcome).write_bytes(image_data)
                      welcome_meta={'welcomeImage':'./data/diverse/laos-files/'+urllib.parse.quote(welcome,safe=''),
                                    'welcomeSha256':hashlib.sha256(image_data).hexdigest()}
                      print('WELCOME IMAGE COPIED',welcome,len(image_data))
                  else:print('WELCOME IMAGE not valid or too large')
              except Exception as error:print('WELCOME IMAGE unavailable:',type(error).__name__,str(error)[:180])
          catalog={'schemaVersion':1,'source':'Public original LAOS filer/index.json, mirrored from source',
                   'sourceUrl':base+'index.json','verified':True,'items':entries,**welcome_meta}
          pathlib.Path('data/diverse/laos-assignments.json').write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('IMPORTED',len(entries),'PDF records. Original protected entries were skipped.')
          PY
      - name: Commit verified source files to migration branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diverse/laos-files data/diverse/laos-assignments.json
          if git diff --cached --quiet; then echo "Already up to date"; else
            git commit -m "Mirror public LAOS PDFs and their verified source index"
            git push origin HEAD:feature/import-verified-kok-source
          fi

  import-original-andrekok:
    if: github.head_ref == 'feature/import-verified-kok-source' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Convert original AndreKokSider embedded records to JSON
        run: |
          python3 - <<'PY'
          import json, re, pathlib, urllib.request
          url="https://tormt.folk.ntnu.no/diverse/AndreKokSider/"
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'FolkNettside-v2-readonly-source-migration/1.0'}),timeout=30) as r:
              raw=r.read(300000).decode('utf-8','replace')
          section=re.search(r'const\s+pages\s*=\s*\[([\s\S]*?)\]\s*;',raw)
          if not section:
              raise RuntimeError('Original page did not contain a pages array; refusing to replace catalog')
          body=section.group(1)
          pattern=r'\{\s*id:\s*(\d+),\s*title:\s*["\']([^"\']+)["\'],\s*study:\s*["\']([^"\']+)["\'],\s*specialization:\s*["\']([^"\']+)["\'],\s*rating:\s*(\d+),\s*year:\s*(\d+),\s*passwordProtected:\s*(true|false)\s*,?\s*\}'
          records=re.findall(pattern,body)
          if not 20<=len(records)<=200 or len(set(r[0] for r in records))!=len(records):
              raise RuntimeError('Unexpected directory size or duplicate IDs: '+str(len(records)))
          previous=json.loads(pathlib.Path('data/diverse/kok-sites.json').read_text(encoding='utf-8'))
          descriptions={e['name'].casefold():e for e in previous.get('items',[]) if e.get('description')}
          entries=[]
          for id,title,study,specialization,rating,year,locked in records:
              supplement=descriptions.get(title.casefold())
              entries.append({
                'name':title,
                'url':'https://folk.ntnu.no/'+title.lower()+'/',
                'study':study,'specialization':specialization,'cohort':year,
                'rating':int(rating),'ratingScale':10,
                'sourceId':int(id),'passwordProtected':locked=='true',
                'description':supplement['description'] if supplement else '',
                'descriptionSource':supplement['source'] if supplement else '',
                'source':url
              })
          manifest={'schemaVersion':1,'source':'Original AndreKokSider embedded directory, fetched from public HTML',
                    'sourceUrl':url,'verified':True,'items':entries}
          pathlib.Path('data/diverse/kok-sites.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('ORIGINAL ANDREKOK IMPORT',len(entries),'IDs',[e['sourceId'] for e in entries])
          print('OTHER SOURCE SUPPLEMENTED DESCRIPTIONS',sum(bool(e['description']) for e in entries))
          for marker in ('folk.ntnu.no','title.toLowerCase','passwordProtected'):
              m=re.search(re.escape(marker),raw,re.I)
              if m:print('ORIGINAL LINK/LOCK EVIDENCE',marker,repr(raw[max(0,m.start()-120):m.start()+230]))
          PY
      - name: Commit original directory to migration branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diverse/kok-sites.json
          if git diff --cached --quiet; then echo "Already up to date"; else
            git commit -m "Import original AndreKokSider records and preserve sourced descriptions"
            git push origin HEAD:feature/import-verified-kok-source
          fi
